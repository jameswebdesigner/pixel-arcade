
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Quest | Pixel Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🚀 captain pixel!</h1>
    <p>Arrow keys to move | Spacebar to jump</p>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

<button id="fullscreenButton" type="button">
    ⛶ FULL SCREEN
</button>

<script>
document.getElementById("fullscreenButton").addEventListener("click", function () {
    const game = document.getElementById("gameCanvas");

    if (!document.fullscreenElement) {
        game.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
});
</script>

    <p>
        <a href="games.html" class="back-link">
            ← Back to Game Library
        </a>
    </p>

<!-- Background music -->
<audio id="backgroundMusic" loop>
    <source src="audio/space-music.mp3" type="audio/mpeg">
</audio>



    <script src="platformer.js"></script>
</body>
</html>
