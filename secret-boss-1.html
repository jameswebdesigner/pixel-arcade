
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borp's Revenge</title>

<style>
    body {
        margin: 0;
        background: #080b16;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    h1 {
        color: #39ff14;
        text-shadow: 0 0 20px #39ff14;
        margin: 15px;
    }

    canvas {
        background: #101c25;
        border: 3px solid #39ff14;
        border-radius: 12px;
        box-shadow: 0 0 30px #39ff1455;
        max-width: 95vw;
        max-height: 75vh;
        cursor: crosshair;
    }

    button {
        background: #39ff14;
        color: black;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    p {
        color: #aab8cc;
    }
</style>
</head>

<body>

<h1>BORP'S REVENGE</h1>

<canvas id="game" width="900" height="550"></canvas>

<p>
    WASD / Arrow Keys: Move |
    Click: Fireball |
    SPACE: Meteor Attack
</p>

<button onclick="location.reload()">Restart Battle</button>
<button onclick="location.href='secret-access.html'">Return to Portal</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};

let gameOver = false;
let victory = false;
let phase = 1;
let fireballs = [];
let arrows = [];
let meteors = [];
let particles = [];

let fireCooldown = 0;
let meteorCooldown = 0;
let shake = 0;
let frame = 0;

// YOU ARE BORP!

const borp = {
    x: 150,
    y: 275,
    width: 90,
    height: 75,
    speed: 3,
    health: 15,
    maxHealth: 15,
    flash: 0
};

// THE EVIL FOREST BLOB!

const blob = {
    x: 750,
    y: 275,
    radius: 22,
    speed: 2.1,
    health: 15,
    maxHealth: 15,
    flash: 0,
    dodgeX: 0,
    dodgeY: 0,
    dodgeTimer: 0,
    dodgeCooldown: 0,
    shootTimer: 0
};

document.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (
        e.code === "Space" ||
        e.code.startsWith("Arrow")
    ) {
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

// BORP'S FIREBALLS

canvas.addEventListener("mousedown", e => {

    if (gameOver || victory || fireCooldown > 0) return;

    const rect = canvas.getBoundingClientRect();

    const mouseX =
        (e.clientX - rect.left) *
        canvas.width / rect.width;

    const mouseY =
        (e.clientY - rect.top) *
        canvas.height / rect.height;

    const angle = Math.atan2(
        mouseY - borp.y,
        mouseX - borp.x
    );

    fireballs.push({
        x: borp.x,
        y: borp.y,
        vx: Math.cos(angle) * 7,
        vy: Math.sin(angle) * 7,
        radius: 11
    });

    fireCooldown = 22;
});

// PARTICLE EXPLOSIONS

function explode(x, y, color, amount = 25) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 40,
            color
        });
    }
}

// DAMAGE BORP

function hurtBorp() {

    if (borp.flash > 0 || gameOver || victory) return;

    borp.health--;
    borp.flash = 45;
    shake = 10;

    explode(borp.x, borp.y, "#39ff14", 15);

    // BORP'S PURPLE PHASE!

    if (borp.health <= 0 && phase === 1) {

        phase = 2;

        borp.health = 20;
        borp.maxHealth = 20;
        borp.speed = 4;

        shake = 25;

        explode(borp.x, borp.y, "#bb44ff", 100);

    } else if (borp.health <= 0) {

        gameOver = true;

        explode(borp.x, borp.y, "#bb44ff", 100);
    }
}

// DAMAGE THE BLOB

function hurtBlob(amount) {

    if (victory || gameOver) return;

    blob.health -= amount;
    blob.flash = 15;

    explode(blob.x, blob.y, "#00ddbb");

    if (blob.health <= 0) {

        blob.health = 0;
        victory = true;
        shake = 20;

        explode(blob.x, blob.y, "#00ddbb", 100);
    }
}
// PHASE ONE SPREAD ATTACK

function spreadAttack() {

    if (meteorCooldown > 0 || phase !== 1) return;

    meteorCooldown = 1000;

    const angle = Math.atan2(
        blob.y - borp.y,
        blob.x - borp.x
    );

    for (let i = -3; i <= 3; i++) {

        const bulletAngle = angle + i * 0.30;

        fireballs.push({
            x: borp.x,
            y: borp.y,
            vx: Math.cos(bulletAngle) * 5,
            vy: Math.sin(bulletAngle) * 5,
            radius: 4
        });
    }
}
// METEOR ATTACK

function summonMeteors() {

    if (meteorCooldown > 0) return;

    meteorCooldown = 360;

    for (let i = 0; i < 8; i++) {

        meteors.push({
            x: i === 0
                ? blob.x
                : Math.random() * 780 + 60,

            y: i === 0
                ? blob.y
                : Math.random() * 430 + 60,

            timer: 65 + i * 10,
            radius: 55
        });
    }
}

// UPDATE GAME

function update() {

    if (gameOver || victory) return;

    frame++;

    if (borp.flash > 0) borp.flash--;
    if (blob.flash > 0) blob.flash--;
    if (fireCooldown > 0) fireCooldown--;
    if (meteorCooldown > 0) meteorCooldown--;
    if (shake > 0) shake--;

    // BORP MOVEMENT

    let moveX = 0;
    let moveY = 0;

    if (keys.KeyW || keys.ArrowUp) moveY--;
    if (keys.KeyS || keys.ArrowDown) moveY++;
    if (keys.KeyA || keys.ArrowLeft) moveX--;
    if (keys.KeyD || keys.ArrowRight) moveX++;

    const moveLength = Math.hypot(moveX, moveY);

    if (moveLength > 0) {
        borp.x += moveX / moveLength * borp.speed;
        borp.y += moveY / moveLength * borp.speed;
    }

    borp.x = Math.max(50, Math.min(850, borp.x));
    borp.y = Math.max(70, Math.min(490, borp.y));

    if (keys.Space) {
    if (phase === 1) {
        spreadAttack();
    } else if (phase === 2) {
        summonMeteors();
    }
}
    // BLOB AI

    if (blob.dodgeCooldown > 0) blob.dodgeCooldown--;

    // LOOK FOR INCOMING FIREBALLS

    for (const fireball of fireballs) {

        const dx = blob.x - fireball.x;
        const dy = blob.y - fireball.y;

        const distance = Math.hypot(dx, dy);

        const approaching =
            dx * fireball.vx + dy * fireball.vy > 0;

        if (
            distance < 125 &&
            approaching &&
            blob.dodgeCooldown === 0
        ) {

            const angle = Math.atan2(
                fireball.vy,
                fireball.vx
            ) + Math.PI / 2;

            const direction =
                Math.random() < 0.5 ? -1 : 1;

            blob.dodgeX =
                Math.cos(angle) * 7 * direction;

            blob.dodgeY =
                Math.sin(angle) * 7 * direction;

            blob.dodgeTimer = 15;
            blob.dodgeCooldown = 75;

            break;
        }
    }

    // DODGE METEORS

    for (const meteor of meteors) {

        const dx = blob.x - meteor.x;
        const dy = blob.y - meteor.y;

        if (
            Math.hypot(dx, dy) < meteor.radius + 25 &&
            meteor.timer < 25 &&
            blob.dodgeCooldown === 0
        ) {

            const angle = Math.atan2(dy, dx);

            blob.dodgeX = Math.cos(angle) * 7;
            blob.dodgeY = Math.sin(angle) * 7;

            blob.dodgeTimer = 15;
            blob.dodgeCooldown = 75;

            break;
        }
    }

    if (blob.dodgeTimer > 0) {

        blob.x += blob.dodgeX;
        blob.y += blob.dodgeY;
        blob.dodgeTimer--;

        particles.push({
            x: blob.x,
            y: blob.y,
            vx: 0,
            vy: 0,
            life: 15,
            color: "#00ddbb"
        });

    } else {

        // CHASE BORP LIKE A SNIP!

        const dx = borp.x - blob.x;
        const dy = borp.y - blob.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 65) {

            blob.x += dx / distance * blob.speed;
            blob.y += dy / distance * blob.speed;
        }
    }

    blob.x = Math.max(25, Math.min(875, blob.x));
    blob.y = Math.max(55, Math.min(525, blob.y));

    // BLOB SHOOTS ARROWS

    blob.shootTimer++;

    if (blob.shootTimer > 65) {

        blob.shootTimer = 0;

        const angle = Math.atan2(
            borp.y - blob.y,
            borp.x - blob.x
        );

        arrows.push({
            x: blob.x,
            y: blob.y,
            vx: Math.cos(angle) * 6,
            vy: Math.sin(angle) * 6,
            angle
        });
    }

    // CONTACT DAMAGE

    if (
        Math.abs(blob.x - borp.x) <
            borp.width / 2 + blob.radius &&
        Math.abs(blob.y - borp.y) <
            borp.height / 2 + blob.radius
    ) {
        hurtBorp();
    }

    // UPDATE FIREBALLS

    for (let i = fireballs.length - 1; i >= 0; i--) {

        const f = fireballs[i];

        f.x += f.vx;
        f.y += f.vy;

        if (
            Math.hypot(f.x - blob.x, f.y - blob.y) <
            f.radius + blob.radius
        ) {

            hurtBlob(1);
            fireballs.splice(i, 1);

        } else if (
            f.x < -50 || f.x > 950 ||
            f.y < -50 || f.y > 600
        ) {
            fireballs.splice(i, 1);
        }
    }

    // UPDATE ARROWS

    for (let i = arrows.length - 1; i >= 0; i--) {

        const a = arrows[i];

        a.x += a.vx;
        a.y += a.vy;

        if (
            Math.abs(a.x - borp.x) < borp.width / 2 &&
            Math.abs(a.y - borp.y) < borp.height / 2
        ) {

            hurtBorp();
            arrows.splice(i, 1);

        } else if (
            a.x < -50 || a.x > 950 ||
            a.y < -50 || a.y > 600
        ) {
            arrows.splice(i, 1);
        }
    }

    // UPDATE METEORS

    for (let i = meteors.length - 1; i >= 0; i--) {

        const m = meteors[i];

        m.timer--;

        if (m.timer <= 0) {

            explode(m.x, m.y, "#ff6600", 45);
            shake = 12;

            if (
                Math.hypot(blob.x - m.x, blob.y - m.y)
                < m.radius + blob.radius
            ) {
                hurtBlob(3);
            }

            meteors.splice(i, 1);
        }
    }
}

// DRAW BORP

function drawBorp() {

    ctx.save();

    ctx.translate(borp.x, borp.y);

    const wobble = Math.sin(frame / 18) * 0.12;
    const squish = Math.sin(frame / 18) * 0.12;

    ctx.rotate(wobble);
    ctx.scale(1 - squish / 2, 1 + squish);

    const color = borp.flash > 0 && borp.flash % 6 < 3
        ? "#ff3333"
        : phase === 1
            ? "#39ff14"
            : "#bb44ff";

    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;

    ctx.fillRect(-45, -37, 90, 75);

    ctx.shadowBlur = 0;

    // WALKING LEGS

    const walking =
        keys.KeyW || keys.KeyA ||
        keys.KeyS || keys.KeyD ||
        keys.ArrowUp || keys.ArrowDown ||
        keys.ArrowLeft || keys.ArrowRight;

    const swing = walking
        ? Math.sin(frame / 5) * 10
        : 0;

    ctx.fillStyle = "black";

    ctx.fillRect(-25 + swing, 38, 18, 20);
    ctx.fillRect(10 - swing, 38, 18, 20);

    // ANTENNAE

    ctx.strokeStyle = phase === 1
        ? "#3b7406"
        : "#7222aa";

    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(-20, -35);
    ctx.lineTo(-27, -60);

    ctx.moveTo(20, -35);
    ctx.lineTo(27, -60);

    ctx.stroke();

    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.arc(-27, -60, 7, 0, Math.PI * 2);
    ctx.arc(27, -60, 7, 0, Math.PI * 2);
    ctx.fill();

    // GIANT ALIEN EYES

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-20, -12, 12, 0, Math.PI * 2);
    ctx.arc(20, -12, 12, 0, Math.PI * 2);
    ctx.fill();

    const eyeX = Math.max(
        -5, Math.min(5, (blob.x - borp.x) / 40)
    );

    const eyeY = Math.max(
        -5, Math.min(5, (blob.y - borp.y) / 40)
    );

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-20 + eyeX, -12 + eyeY, 5, 0, Math.PI * 2);
    ctx.arc(20 + eyeX, -12 + eyeY, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// DRAW THE FOREST BLOB

function drawBlob() {

    if (victory) return;

    ctx.save();
    ctx.translate(blob.x, blob.y);

    const swing = Math.sin(frame / 5) * 6;

    // LITTLE WALKING LEGS

    ctx.strokeStyle = "#126b52";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(-10, 14);
    ctx.lineTo(-13 + swing, 29);
    ctx.moveTo(10, 14);
    ctx.lineTo(13 - swing, 29);
    ctx.stroke();

    // BLOB BODY

    ctx.fillStyle = blob.flash > 0
        ? "#ff3333"
        : "#00ddbb";

    ctx.shadowColor = "#00ddbb";
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // EYES

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-8, -5, 6, 0, Math.PI * 2);
    ctx.arc(8, -5, 6, 0, Math.PI * 2);
    ctx.fill();

    const eyeX = Math.max(
        -3, Math.min(3, (borp.x - blob.x) / 30)
    );

    const eyeY = Math.max(
        -3, Math.min(3, (borp.y - blob.y) / 30)
    );

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-8 + eyeX, -5 + eyeY, 3, 0, Math.PI * 2);
    ctx.arc(8 + eyeX, -5 + eyeY, 3, 0, Math.PI * 2);
    ctx.fill();

    // BOW

    const angle = Math.atan2(
        borp.y - blob.y,
        borp.x - blob.x
    );

    ctx.rotate(angle);

    ctx.strokeStyle = "#b87938";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.arc(10, 0, 19, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(10, -19);
    ctx.lineTo(10, 19);
    ctx.stroke();

    ctx.restore();
}

// HEALTH BAR FUNCTION

function healthBar(x, y, width, health, max, color, name) {

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "left";

    ctx.fillText(name + "  " + health + "/" + max, x, y - 7);

    ctx.fillStyle = "#333333";
    ctx.fillRect(x, y, width, 16);

    ctx.fillStyle = color;
    ctx.fillRect(
        x, y,
        width * Math.max(0, health / max),
        16
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, 16);
}

// DRAW THE ARENA

function draw() {

    ctx.clearRect(0, 0, 900, 550);

    ctx.fillStyle = phase === 1
        ? "#10251f"
        : "#20102f";

    ctx.fillRect(0, 0, 900, 550);

    // ARENA GRID

    ctx.strokeStyle = "#ffffff09";
    ctx.lineWidth = 1;

    for (let x = 0; x < 900; x += 40) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 550);
        ctx.stroke();
    }

    for (let y = 0; y < 550; y += 40) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(900, y);
        ctx.stroke();
    }

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );
    }

    // METEOR WARNING CIRCLES

    for (const m of meteors) {

        ctx.fillStyle = "#ff330033";
        ctx.strokeStyle = "#ff4400";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ff6600";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText("!", m.x, m.y + 6);
    }

    // FIREBALLS

    for (const f of fireballs) {

        ctx.shadowColor = "#ff6600";
        ctx.shadowBlur = f.radius === 4 ? 8 : 20;
        ctx.fillStyle = "#ff6600";

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffff88";

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
    }

    // ARROWS

    for (const a of arrows) {

        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);

        ctx.strokeStyle = "#c48b50";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();

        ctx.fillStyle = "#dddddd";

        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(5, -5);
        ctx.lineTo(5, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    if (!gameOver) drawBorp();

    drawBlob();

    // PARTICLES

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD

    healthBar(
        20, 35, 280,
        borp.health, borp.maxHealth,
        phase === 1 ? "#39ff14" : "#bb44ff",
        "BORP (YOU)"
    );

    healthBar(
        600, 35, 280,
        blob.health, blob.maxHealth,
        "#00ddbb",
        "FOREST BLOB"
    );

    ctx.textAlign = "center";
    ctx.font = "bold 20px Arial";
    ctx.fillStyle = phase === 1
        ? "#39ff14"
        : "#bb44ff";

    ctx.fillText("PHASE " + phase, 450, 35);

    ctx.font = "bold 17px Arial";

    ctx.fillStyle = meteorCooldown === 0
        ? "#ffcc00"
        : "#aaaaaa";

    ctx.fillText(
    meteorCooldown === 0
        ? phase === 1
            ? "SPREAD ATTACK READY!"
            : "METEOR ATTACK READY!"
        : (phase === 1 ? "Spread" : "Meteor") +
          " recharge: " +
          Math.ceil(meteorCooldown / 60) + "s",
    450, 525
);

    // VICTORY SCREEN

    if (victory || gameOver) {

        ctx.fillStyle = "#000000cc";
        ctx.fillRect(0, 0, 900, 550);

        ctx.textAlign = "center";
        ctx.font = "bold 65px Arial";

        ctx.fillStyle = victory
            ? "#39ff14"
            : "#ff3333";

        ctx.fillText(
            victory ? "BORP WINS!" : "BORP DEFEATED!",
            450, 230
        );

        ctx.font = "24px Arial";
        ctx.fillStyle = "white";

        ctx.fillText(
            victory
                ? "The Forest Blob has been defeated! Try code sun!"
                : "The Forest Blob wins again!",
            450, 290
        );

        ctx.font = "20px Arial";

        ctx.fillText(
            victory
                ? "YIPPEEEEE!"
                : "Press Restart Battle to try again.",
            450, 340
        );
    }
}

// GAME LOOP

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>
