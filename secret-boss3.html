<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borp vs Captain Pixel</title>
<style>
body {
    margin: 0;
    background: #080e20;
    color: white;
    font-family: monospace;
    text-align: center;
}
h1 {
    color: #79e653;
    text-shadow: 0 0 20px #56bb35;
}
canvas {
    border: 3px solid #526d98;
    max-width: 96%;
    height: auto;
    image-rendering: pixelated;
}
button {
    background: #263957;
    color: white;
    border: 2px solid #6585ae;
    border-radius: 8px;
    padding: 12px 22px;
    margin: 8px;
    cursor: pointer;
    font: bold 16px monospace;
}
#controls {
    padding: 12px;
    line-height: 1.8;
    color: #c2d5ed;
}
</style>
</head>
<body>

<h1>BORP VS CAPTAIN PIXEL</h1>

<canvas id="game" width="960" height="576"></canvas>

<div id="controls">
    A / D: Move | W: Jump | Click: Fireball |
    SPACE: Shockwave | E: Special Attack
</div>

<button onclick="location.reload()">Retry Battle</button>

<button onclick="location.href='secret-access.html'">
    Return to Portal
</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const GROUND = 510;

const keys = {};

let frame = 0;
let phase = 1;
let transition = 120;
let victory = false;
let gameOver = false;
let fireCooldown = 0;
let shockCooldown = 0;
let specialCooldown = 0;
let pixelShootTimer = 0;
let pixelJumpTimer = 0;
let shake = 0;

let fireballs = [];
let lasers = [];
let shockwaves = [];
let hazards = [];
let particles = [];

const colors = [
    "",
    "#69d447",
    "#a85be3",
    "#ffd43b",
    "#ed3838"
];

const names = [
    "",
    "GREEN BORP",
    "PURPLE BORP",
    "GOLDEN BORP",
    "RED BORP"
];

const borp = {
    x: 160,
    y: GROUND-80,
    w: 90,
    h: 80,
    vx: 0,
    vy: 0,
    speed: 4,
    health: 100,
    maxHealth: 100,
    grounded: true,
    flash: 0
};

const pixel = {
    x: 750,
    y: GROUND-48,
    w: 34,
    h: 48,
    vx: 0,
    vy: 0,
    health: 400,
    maxHealth: 400,
    grounded: true,
    flash: 0,
    jetpack: false,
    direction: -1
};

const platforms = [
    {x: 120,y: 350,w: 180,h: 16},
    {x: 390,y: 260,w: 180,h: 16},
    {x: 660,y: 350,w: 180,h: 16}
];

const stars = Array.from(
    {length: 120},
    () => ({
        x: Math.random()*W,
        y: Math.random()*GROUND,
        size: 1+Math.random()*2
    })
);

window.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    keys[key] = true;

    if (
        [" ","arrowup","arrowleft","arrowright"]
        .includes(key)
    ) e.preventDefault();

    if (e.repeat) return;

    if (key === " ") shockwave();
    if (key === "e") specialAttack();

});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) keys[key] = false;
});

canvas.addEventListener("pointerdown", e => {

    const bounds = canvas.getBoundingClientRect();

    const x = (e.clientX-bounds.left)*W/bounds.width;
    const y = (e.clientY-bounds.top)*H/bounds.height;

    shoot(x,y);

});

function active() {
    return !gameOver && !victory && transition === 0;
}

function rect(x,y,w,h,color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x),Math.floor(y),w,h);
}

function burst(x,y,color,count) {

    for (let i = 0; i < count; i++) {

        particles.push({
            x,y,color,
            vx: (Math.random()-.5)*10,
            vy: (Math.random()-.5)*10,
            life: 40
        });

    }

}

function shoot(x,y) {

    if (!active() || fireCooldown > 0) return;

    fireCooldown = phase === 4 ? 12 : 24;

    const cx = borp.x+borp.w/2;
    const cy = borp.y+borp.h/2;

    const angle = Math.atan2(y-cy,x-cx);

    const count = phase === 4 ? 3 : 1;

    for (let i = 0; i < count; i++) {

        const a = angle+(i-(count-1)/2)*.2;

        fireballs.push({
            x: cx,
            y: cy,
            vx: Math.cos(a)*8,
            vy: Math.sin(a)*8,
            damage: phase === 4 ? 12 : 10
        });

    }

}

function shockwave() {

    if (!active() || shockCooldown > 0) return;

    shockCooldown = 240;

    shockwaves.push({
        x: borp.x+borp.w/2,
        y: borp.y+borp.h/2,
        radius: 20,
        hit: false
    });

    shake = 15;

}

function specialAttack() {

    if (!active() || specialCooldown > 0) return;

    specialCooldown = 420;

    if (phase === 1) {

        const cx = borp.x+borp.w/2;
        const cy = borp.y+borp.h/2;

        for (let i = 0; i < 16; i++) {

            const a = i/16*Math.PI*2;

            fireballs.push({
                x: cx,
                y: cy,
                vx: Math.cos(a)*7,
                vy: Math.sin(a)*7,
                damage: 15
            });

        }

    } else {

        for (let i = 0; i < 8; i++) {

            hazards.push({
                x: i === 0
                    ? pixel.x+pixel.w/2
                    : 50+Math.random()*(W-100),
                timer: 50+i*8,
                width: phase === 4 ? 100 : 65,
                hit: false,
                type: phase === 2
                    ? "meteor"
                    : "lightning"
            });

        }

    }

}

function hurtBorp(damage) {

    if (!active() || borp.flash > 0) return;

    borp.health = Math.max(0,borp.health-damage);
    borp.flash = 45;
    shake = 8;

    burst(
        borp.x+borp.w/2,
        borp.y+borp.h/2,
        colors[phase],
        25
    );

    if (borp.health <= 0) {

        if (phase === 4) {

            gameOver = true;

        } else {

            transform();

        }

    }

}

function hurtPixel(damage) {

    if (!active() || pixel.flash > 0) return;

    pixel.health = Math.max(0,pixel.health-damage);
    pixel.flash = 12;
    shake = 5;

    burst(
        pixel.x+pixel.w/2,
        pixel.y+pixel.h/2,
        "#82d9ff",
        20
    );

    if (pixel.health <= 0) {

        victory = true;

        try {
            localStorage.setItem("boss3Victory","true");
        } catch {}

    }

}

function transform() {

    phase++;
    transition = 150;

    borp.maxHealth = 100+(phase-1)*25;
    borp.health = borp.maxHealth;
    borp.speed = 4+(phase-1)*.6;

    borp.x = 160;
    borp.y = GROUND-borp.h;
    borp.vy = 0;
    borp.grounded = true;
    borp.flash = 0;

    pixel.x = 750;
    pixel.y = GROUND-pixel.h;
    pixel.vy = 0;
    pixel.grounded = true;
    pixel.jetpack = false;

    fireballs = [];
    lasers = [];
    hazards = [];
    shockwaves = [];

    fireCooldown = 0;
    shockCooldown = 0;
    specialCooldown = 0;

    burst(
        borp.x+45,
        borp.y+40,
        colors[phase],
        150
    );

    shake = 30;

}

function physics(character) {

    const oldBottom = character.y+character.h;

    character.x += character.vx;

    character.vy += .55;
    character.vy = Math.min(16,character.vy);

    character.y += character.vy;

    character.grounded = false;

    if (character.y+character.h >= GROUND) {

        character.y = GROUND-character.h;
        character.vy = 0;
        character.grounded = true;

    }

    for (const p of platforms) {

        if (
            character.vy >= 0 &&
            oldBottom <= p.y &&
            character.y+character.h >= p.y &&
            character.x+character.w > p.x &&
            character.x < p.x+p.w
        ) {

            character.y = p.y-character.h;
            character.vy = 0;
            character.grounded = true;

        }

    }

    character.x = Math.max(
        0,
        Math.min(W-character.w,character.x)
    );

    if (character.y < 105) {

        character.y = 105;
        character.vy = 0;

    }

}

function updateBorp() {

    borp.vx = 0;

    if (keys.a || keys.arrowleft) {
        borp.vx = -borp.speed;
    }

    if (keys.d || keys.arrowright) {
        borp.vx = borp.speed;
    }

    if (
        (keys.w || keys.arrowup) &&
        borp.grounded
    ) {

        borp.vy = -15;

    }

    physics(borp);

}

function updatePixel() {

    const target = borp.x+borp.w/2;
    const center = pixel.x+pixel.w/2;
    const dx = target-center;

    pixel.direction = dx < 0 ? -1 : 1;

    pixel.vx = Math.sign(dx)*3.5;

    pixelJumpTimer--;
    pixelShootTimer++;

    // Dodge incoming fireballs.

    const danger = fireballs.some(b =>
        Math.hypot(
            b.x-center,
            b.y-(pixel.y+24)
        ) < 95
    );

    // Jump toward Borp's head.

    if (
        pixel.grounded &&
        pixelJumpTimer <= 0 &&
        (Math.abs(dx) < 230 || danger)
    ) {

        pixel.vy = -14;
        pixelJumpTimer = 65;

    }

    // Use the jetpack to get above Borp.

    pixel.jetpack =
        !pixel.grounded &&
        pixel.y > borp.y-80 &&
        Math.abs(dx) < 180 &&
        pixel.vy < 2;

    if (pixel.jetpack) {

        pixel.vy -= .9;

    }

    // Shoot energy blasts.

    if (pixelShootTimer >= 100) {

        pixelShootTimer = 0;

        const angle = Math.atan2(
            borp.y+40-(pixel.y+24),
            target-center
        );

        lasers.push({
            x: center,
            y: pixel.y+24,
            vx: Math.cos(angle)*6,
            vy: Math.sin(angle)*6
        });

    }

    const oldBottom = pixel.y+pixel.h;

    physics(pixel);

    // Stomp on Borp's head.

    if (
        pixel.vy > 0 &&
        oldBottom <= borp.y+15 &&
        pixel.y+pixel.h >= borp.y &&
        pixel.x+pixel.w > borp.x &&
        pixel.x < borp.x+borp.w
    ) {

        pixel.vy = -12;

        hurtBorp(20);

    }

}

function updateProjectiles() {

    for (let i = fireballs.length-1; i >= 0; i--) {

        const b = fireballs[i];

        b.x += b.vx;
        b.y += b.vy;

        if (
            b.x > pixel.x-10 &&
            b.x < pixel.x+pixel.w+10 &&
            b.y > pixel.y-10 &&
            b.y < pixel.y+pixel.h+10
        ) {

            hurtPixel(b.damage);
            fireballs.splice(i,1);

        } else if (
            b.x < -30 || b.x > W+30 ||
            b.y < -30 || b.y > H+30
        ) {

            fireballs.splice(i,1);

        }

    }

    for (let i = lasers.length-1; i >= 0; i--) {

        const l = lasers[i];

        l.x += l.vx;
        l.y += l.vy;

        if (
            l.x > borp.x &&
            l.x < borp.x+borp.w &&
            l.y > borp.y &&
            l.y < borp.y+borp.h
        ) {

            lasers.splice(i,1);
            hurtBorp(8);

            if (!active()) return;

        } else if (
            l.x < -30 || l.x > W+30 ||
            l.y < -30 || l.y > H+30
        ) {

            lasers.splice(i,1);

        }

    }

    for (let i = shockwaves.length-1; i >= 0; i--) {

        const s = shockwaves[i];

        s.radius += 7;

        const distance = Math.hypot(
            pixel.x+17-s.x,
            pixel.y+24-s.y
        );

        if (
            !s.hit &&
            Math.abs(distance-s.radius) < 30
        ) {

            s.hit = true;
            hurtPixel(20);

        }

        if (s.radius > 1100) {
            shockwaves.splice(i,1);
        }

    }

    for (let i = hazards.length-1; i >= 0; i--) {

        const h = hazards[i];

        h.timer--;

        if (h.timer === 0) {

            shake = 12;

            burst(
                h.x,GROUND,
                colors[phase],
                35
            );

        }

        if (
            h.timer <= 0 &&
            !h.hit &&
            Math.abs(pixel.x+17-h.x) < h.width/2+17
        ) {

            h.hit = true;
            hurtPixel(25);

        }

        if (h.timer < -20) {
            hazards.splice(i,1);
        }

    }

}

function update() {

    if (gameOver || victory) return;

    frame++;

    shake *= .85;

    for (let i = particles.length-1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.vy += .08;
        p.life--;

        if (p.life <= 0) particles.splice(i,1);

    }

    if (transition > 0) {

        transition--;
        return;

    }

    if (fireCooldown > 0) fireCooldown--;
    if (shockCooldown > 0) shockCooldown--;
    if (specialCooldown > 0) specialCooldown--;
    if (borp.flash > 0) borp.flash--;
    if (pixel.flash > 0) pixel.flash--;

    updateBorp();
    updatePixel();

    if (!active()) return;

    updateProjectiles();

}

function drawBackground() {

    const gradient = ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#070b20");
    gradient.addColorStop(1,"#252950");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);

    for (const s of stars) {

        ctx.globalAlpha =
            .5+Math.sin(frame*.025+s.x)*.3;

        rect(s.x,s.y,s.size,s.size,"#ffffff");

    }

    ctx.globalAlpha = 1;

    // Planet.

    ctx.fillStyle = "#343f75";

    ctx.beginPath();
    ctx.arc(780,180,95,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#7788b5";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.ellipse(780,180,145,25,-.3,0,Math.PI*2);
    ctx.stroke();

    // Platforms.

    for (const p of platforms) {

        rect(p.x,p.y,p.w,p.h,"#455674");
        rect(p.x,p.y,p.w,4,"#72d5ff");

        for (let x = p.x+10; x < p.x+p.w-5; x += 25) {

            rect(x,p.y+8,10,4,"#26354d");

        }

    }

    // Floor.

    rect(0,GROUND,W,H-GROUND,"#344359");
    rect(0,GROUND,W,6,"#7ad7ff");

    for (let x = 0; x < W; x += 48) {

        ctx.strokeStyle = "#202d43";
        ctx.strokeRect(x,GROUND+6,48,60);

    }

}

function drawBorp() {

    if (borp.flash > 0 && frame%10 < 5) return;

    ctx.save();
    ctx.translate(borp.x,borp.y);

    const color = colors[phase];

    const walk = borp.vx !== 0
        ? Math.sin(frame*.25)*5
        : 0;

    if (phase >= 3) {

        ctx.shadowColor = color;
        ctx.shadowBlur = 25;

    }

    // Legs.

    rect(12,60,22,20+walk,color);
    rect(56,60,22,20-walk,color);

    // Bean-shaped body.

    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.roundRect(0,0,90,68,28);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Eyes.

    rect(15,16,23,24,"white");
    rect(52,16,23,24,"white");

    const look = pixel.x > borp.x ? 10 : 3;

    rect(15+look,22,9,13,"#15201b");
    rect(52+look,22,9,13,"#15201b");

    // Mouth.

    rect(31,48,28,7,"#263024");

    if (phase === 3) {

        rect(20,-12,50,12,"#e9b522");

        for (let i = 0; i < 3; i++) {
            rect(20+i*19,-24,12,16,"gold");
        }

    }

    if (phase === 4) {

        // Rage horns.

        ctx.fillStyle = "#ff9b32";

        ctx.beginPath();
        ctx.moveTo(5,10);
        ctx.lineTo(0,-20);
        ctx.lineTo(25,0);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(85,10);
        ctx.lineTo(90,-20);
        ctx.lineTo(65,0);
        ctx.fill();

        // Angry eyebrows.

        ctx.strokeStyle = "#561414";
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.moveTo(12,10);
        ctx.lineTo(40,19);
        ctx.moveTo(50,19);
        ctx.lineTo(78,10);
        ctx.stroke();

    }

    ctx.restore();

}

function drawPixel() {

    if (pixel.flash > 0 && frame%6 < 3) return;

    ctx.save();

    ctx.translate(
        pixel.x+pixel.w/2,
        pixel.y
    );

    ctx.scale(pixel.direction,1);

    const walk = pixel.grounded
        ? Math.sin(frame*.3)*3
        : 0;

    // Jetpack.

    rect(-21,18,9,22,"#65748b");

    if (pixel.jetpack) {

        rect(-21,39,9,14,"#ff7722");
        rect(-19,39,5,20,"#ffdf66");

    }

    // Legs.

    rect(-12,35,10,13+walk,"#b8c7d8");
    rect(2,35,10,13-walk,"#dce6ef");

    // Space suit.

    rect(-14,19,28,20,"#dce6ef");
    rect(-7,23,14,8,"#4378b4");
    rect(-4,25,4,4,"#6af5ad");

    // Arms.

    rect(-19,20,7,16,"#aebed0");
    rect(12,20,7,16,"#aebed0");

    // Helmet.

    rect(-17,0,34,22,"#e6eef5");
    rect(-13,-3,26,5,"#e6eef5");

    // Blue visor.

    rect(-13,5,29,12,"#247dc2");
    rect(-9,7,14,3,"#a0eaff");

    ctx.restore();

}

function drawAttacks() {

    for (const b of fireballs) {

        ctx.shadowColor = colors[phase];
        ctx.shadowBlur = 20;

        ctx.fillStyle = phase === 1
            ? "#ff8822"
            : colors[phase];

        ctx.beginPath();
        ctx.arc(b.x,b.y,10,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#fff4bb";

        ctx.beginPath();
        ctx.arc(b.x,b.y,4,0,Math.PI*2);
        ctx.fill();

        ctx.shadowBlur = 0;

    }

    for (const l of lasers) {

        ctx.strokeStyle = "#63dcff";
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.moveTo(l.x,l.y);
        ctx.lineTo(l.x-l.vx*3,l.y-l.vy*3);
        ctx.stroke();

    }

    for (const s of shockwaves) {

        ctx.strokeStyle = colors[phase];
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
        ctx.stroke();

    }

    for (const h of hazards) {

        if (h.timer > 0) {

            rect(
                h.x-h.width/2,
                100,
                h.width,
                GROUND-100,
                "rgba(255,50,50,.2)"
            );

            if (h.type === "meteor") {

                ctx.fillStyle = "#ff7733";

                ctx.beginPath();
                ctx.arc(
                    h.x,
                    GROUND-h.timer*8,
                    18,0,Math.PI*2
                );
                ctx.fill();

            }

        } else {

            ctx.shadowColor = colors[phase];
            ctx.shadowBlur = 25;

            rect(
                h.x-h.width/2,
                100,
                h.width,
                GROUND-100,
                h.type === "meteor"
                    ? "#ff7733"
                    : colors[phase]
            );

            rect(
                h.x-5,
                100,
                10,
                GROUND-100,
                "white"
            );

            ctx.shadowBlur = 0;

        }

    }

}

function bar(x,y,w,hp,max,color) {

    rect(x,y,w,20,"#1d2336");
    rect(x,y,w*Math.max(0,hp/max),20,color);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.strokeRect(x,y,w,20);

    ctx.fillStyle = "white";
    ctx.font = "bold 13px monospace";
    ctx.textAlign = "center";

    ctx.fillText(hp+"/"+max,x+w/2,y+15);

}

function drawHUD() {

    rect(0,0,W,100,"#080d1d");

    ctx.font = "bold 20px monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = colors[phase];

    ctx.fillText(names[phase],20,25);

    bar(
        20,35,320,
        borp.health,
        borp.maxHealth,
        colors[phase]
    );

    ctx.textAlign = "right";
    ctx.fillStyle = "#83d5ff";

    ctx.fillText("CAPTAIN PIXEL",W-20,25);

    bar(
        W-340,35,320,
        pixel.health,
        pixel.maxHealth,
        "#e84b4b"
    );

    ctx.font = "14px monospace";
    ctx.fillStyle = "white";
    ctx.textAlign = "left";

    ctx.fillText(
        "Shockwave: "+
        (shockCooldown === 0
            ? "READY"
            : Math.ceil(shockCooldown/60)+"s"),
        20,78
    );

    ctx.fillText(
        "Special: "+
        (specialCooldown === 0
            ? "READY"
            : Math.ceil(specialCooldown/60)+"s"),
        220,78
    );

    ctx.textAlign = "right";

    ctx.fillText("Form "+phase+"/4",W-20,78);

}

function draw() {

    ctx.clearRect(0,0,W,H);

    ctx.save();

    if (shake > 1) {

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }

    drawBackground();
    drawAttacks();
    drawBorp();
    drawPixel();

    for (const p of particles) {

        ctx.globalAlpha = p.life/40;
        rect(p.x,p.y,5,5,p.color);

    }

    ctx.globalAlpha = 1;

    ctx.restore();

    drawHUD();

    if (transition > 0) {

        rect(0,100,W,H-100,"#0009");

        ctx.textAlign = "center";
        ctx.font = "bold 48px monospace";
        ctx.fillStyle = colors[phase];

        ctx.fillText(names[phase],W/2,270);

        ctx.font = "bold 24px monospace";
        ctx.fillStyle = "white";

        ctx.fillText(
            phase === 1
                ? "THE BATTLE BEGINS"
                : "TRANSFORMATION!",
            W/2,320
        );

        if (phase === 4) {

            ctx.fillStyle = "#ff4444";

            ctx.fillText(
                "RAGE MODE ACTIVATED",
                W/2,370
            );

        }

    }

    if (victory || gameOver) {

        rect(0,0,W,H,"#000d");

        ctx.textAlign = "center";
        ctx.font = "bold 48px monospace";

        ctx.fillStyle = victory
            ? "gold"
            : "#ff4444";

        ctx.fillText(
            victory
                ? "BORP WINS!"
                : "BORP HAS FALLEN",
            W/2,230
        );

        ctx.font = "bold 24px monospace";
        ctx.fillStyle = "white";

        ctx.fillText(
            victory
                ? "Captain Pixel has been defeated!"
                : "All four forms have been defeated.",
            W/2,290
        );

        if (victory) {

            ctx.fillStyle = "#69d447";

            ctx.fillText(
                "THE LEGEND OF BORP CONTINUES...",
                W/2,370
            );

        }

    }

}

let previousTime = performance.now();
let accumulator = 0;

function loop(now) {

    accumulator += Math.min(now-previousTime,100);
    previousTime = now;

    while (accumulator >= 1000/60) {

        update();
        accumulator -= 1000/60;

    }

    draw();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
