<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forest Defence</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #14271d;
    color: white;
    font-family: monospace;
    text-align: center;
}
h1 { color: #a9ed76; margin: 12px; }
button {
    background: #365d32;
    border: 2px solid #8bc46a;
    color: white;
    padding: 10px;
    margin: 4px;
    border-radius: 6px;
    font: bold 14px monospace;
    cursor: pointer;
}
button:hover { background: #518746; }
button.selected { border-color: gold; color: gold; }
button:disabled { opacity: .45; cursor: default; }
canvas {
    background: #609647;
    border: 4px solid #947044;
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    cursor: crosshair;
    touch-action: none;
}
#hud {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 12px;
    color: gold;
    font-size: 18px;
}
#message { min-height: 24px; color: #d9f4ae; }
</style>
</head>
<body>

<h1>🌳 FOREST DEFENCE</h1>

<div id="hud">
    <span id="coins"></span>
    <span id="health"></span>
    <span id="wave"></span>
</div>

<div>
    <button onclick="selectTower(0)" id="tower0">🌼 Snip — 50</button>
    <button onclick="selectTower(1)" id="tower1">🏹 Blob — 100</button>
    <button onclick="selectTower(2)" id="tower2">🐉 Borp — 250</button>
    <button onclick="selectTower(3)" id="tower3">🌳 Magic Tree — 175</button>
</div>

<canvas id="game" width="960" height="576"></canvas>

<div id="message">Choose a defender and place it beside the path!</div>

<button id="start" onclick="startWave()">Start Wave</button>
<button onclick="selected = null; updateHUD()">Cancel Selection</button>
<button onclick="location.reload()">Restart</button>
<button onclick="location.href='side-adventures.html'">Exit</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 48;
const COLS = 20;
const ROWS = 12;

let coins = 200;
let health = 20;
let wave = 0;
let selected = null;
let running = false;
let gameOver = false;
let victory = false;
let spawnLeft = 0;
let spawnTimer = 0;
let frame = 0;

let towers = [];
let enemies = [];
let bullets = [];
let particles = [];

const types = [
    { name: "Snip", cost: 50, damage: 5,
      range: 115, delay: 40, color: "#ffe25b" },
    { name: "Blob", cost: 100, damage: 12,
      range: 175, delay: 35, color: "#40d6ba" },
    { name: "Borp", cost: 250, damage: 35,
      range: 155, delay: 65, color: "#66e345" },
    { name: "Magic Tree", cost: 175, damage: 8,
      range: 145, delay: 25, color: "#ac8aff" }
];

const path = [
    [-1, 2], [5, 2], [5, 8],
    [11, 8], [11, 3], [16, 3],
    [16, 9], [20, 9]
].map(([x,y]) => ({
    x: x * TILE + TILE / 2,
    y: y * TILE + TILE / 2
}));

function message(text) {
    document.getElementById("message").textContent = text;
}

function updateHUD() {
    document.getElementById("coins").textContent =
        "🪙 " + coins;
    document.getElementById("health").textContent =
        "💎 Crystal: " + health;
    document.getElementById("wave").textContent =
        "Wave: " + wave + "/20";

    document.getElementById("start").disabled =
        running || gameOver || victory;

    types.forEach((type, i) => {
        const button = document.getElementById("tower" + i);
        button.classList.toggle("selected", selected === i);
        button.disabled = coins < type.cost || gameOver || victory;
    });
}

function selectTower(i) {
    if (coins < types[i].cost) return;
    selected = selected === i ? null : i;
    message("Place " + types[i].name + " beside the path.");
    updateHUD();
}

function onPath(x, y) {
    for (let i = 0; i < path.length - 1; i++) {
        const a = path[i];
        const b = path[i + 1];

        if (
            x >= Math.min(a.x,b.x) - 24 &&
            x <= Math.max(a.x,b.x) + 24 &&
            y >= Math.min(a.y,b.y) - 24 &&
            y <= Math.max(a.y,b.y) + 24
        ) return true;
    }
    return false;
}

canvas.addEventListener("pointerdown", e => {
    if (gameOver || victory) return;

    const r = canvas.getBoundingClientRect();

    const x = Math.floor(
        (e.clientX-r.left) * canvas.width/r.width/TILE
    ) * TILE + 24;

    const y = Math.floor(
        (e.clientY-r.top) * canvas.height/r.height/TILE
    ) * TILE + 24;

    const existing = towers.find(t => t.x === x && t.y === y);

    if (existing) {
        const cost = Math.floor(types[existing.type].cost *
            existing.level * .75);

        if (existing.level >= 5) {
            message("Maximum tower level!");
            return;
        }

        if (coins < cost) {
            message("Upgrade costs " + cost + " coins.");
            return;
        }

        coins -= cost;
        existing.level++;
        message("Tower upgraded to level " + existing.level);
        updateHUD();
        return;
    }

    if (selected === null) return;

    if (onPath(x,y)) {
        message("You cannot build on the enemy path!");
        return;
    }

    const type = types[selected];

    if (coins < type.cost) return;

    coins -= type.cost;

    towers.push({
        x, y, type: selected,
        level: 1, cooldown: 0
    });

    message(type.name + " placed! Click a tower to upgrade it.");
    selected = null;
    updateHUD();
});

function startWave() {
    if (running || gameOver || victory) return;

    wave++;
    running = true;
    spawnLeft = 6 + wave * 2;
    spawnTimer = 0;

    message(wave % 5 === 0 ?
        "⚠ BOSS WAVE!" : "Wave " + wave + " incoming!");

    updateHUD();
}

function spawnEnemy(boss) {
    const hp = boss ? 180 + wave * 65 : 20 + wave * 9;

    enemies.push({
        x: path[0].x,
        y: path[0].y,
        target: 1,
        hp,
        maxHP: hp,
        boss,
        speed: boss ? .65 : 1 + wave * .045,
        slow: 0
    });
}

function burst(x,y,color,count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x,y,color,
            vx: (Math.random()-.5)*5,
            vy: (Math.random()-.5)*5,
            life: 30
        });
    }
}

function update() {
    if (gameOver || victory) return;

    frame++;

    if (running && spawnLeft > 0) {
        spawnTimer--;

        if (spawnTimer <= 0) {
            spawnEnemy(wave % 5 === 0 && spawnLeft === 1);
            spawnLeft--;
            spawnTimer = 42;
        }
    }

    for (let i = enemies.length-1; i >= 0; i--) {
        const e = enemies[i];
        const target = path[e.target];

        const dx = target.x-e.x;
        const dy = target.y-e.y;
        const distance = Math.hypot(dx,dy);

        if (e.slow > 0) e.slow--;

        const speed = e.speed * (e.slow > 0 ? .5 : 1);

        if (distance <= speed) {
            e.x = target.x;
            e.y = target.y;
            e.target++;

            if (e.target >= path.length) {
                health = Math.max(0, health - (e.boss ? 5 : 1));
                enemies.splice(i,1);

                if (health === 0) {
                    gameOver = true;
                    message("Your forest crystal was destroyed!");
                }

                updateHUD();
            }
        } else {
            e.x += dx/distance*speed;
            e.y += dy/distance*speed;
        }
    }

    for (const t of towers) {
        if (t.cooldown > 0) t.cooldown--;

        const type = types[t.type];

        const target = enemies.find(e =>
            Math.hypot(e.x-t.x,e.y-t.y) <
            type.range + t.level*5
        );

        if (target && t.cooldown <= 0) {
            bullets.push({
                x:t.x, y:t.y, target,
                damage:type.damage*t.level,
                color:type.color,
                slow:t.type === 3
            });

            t.cooldown = type.delay;
        }
    }

    for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i];

        if (!enemies.includes(b.target)) {
            bullets.splice(i,1);
            continue;
        }

        const dx = b.target.x-b.x;
        const dy = b.target.y-b.y;
        const d = Math.hypot(dx,dy);

        if (d < 7) {
            b.target.hp -= b.damage;

            if (b.slow) b.target.slow = 100;

            burst(b.target.x,b.target.y,b.color,5);

            if (b.target.hp <= 0) {
                coins += b.target.boss ? 200 : 12 + wave;

                burst(b.target.x,b.target.y,"#ffdb54",20);

                enemies.splice(enemies.indexOf(b.target),1);
                updateHUD();
            }

            bullets.splice(i,1);
        } else {
            b.x += dx/d*7;
            b.y += dy/d*7;
        }
    }

    for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0) particles.splice(i,1);
    }

    if (running && spawnLeft === 0 && enemies.length === 0) {
        running = false;
        coins += 50 + wave*10;

        if (wave === 20 && !gameOver) {
            victory = true;
            localStorage.setItem("forestDefenceVictory","true");
            message("🏆 FOREST SAVED!");
        } else if (!gameOver) {
            message("Wave complete! Build and upgrade your defenders.");
        }

        updateHUD();
    }
}

function rect(x,y,w,h,color) {
    ctx.fillStyle = color;
    ctx.fillRect(x,y,w,h);
}

function drawTower(t) {
    ctx.save();
    ctx.translate(t.x,t.y);

    const bob = Math.sin(frame*.07+t.x)*2;
    ctx.translate(0,bob);

    rect(-17,14,34,7,"#365b30");

    if (t.type === 0) {
        rect(-3,0,6,20,"#397c32");
        rect(-18,-12,36,16,"#ffdb40");
        rect(-9,-21,18,34,"#ffdb40");
        rect(-10,-10,20,20,"#a46b31");
        rect(-6,-5,3,5,"#222");
        rect(3,-5,3,5,"#222");
    }

    if (t.type === 1) {
        rect(-17,-10,34,24,"#229b83");
        rect(-12,-16,24,32,"#48dfbf");
        rect(-8,-6,5,7,"#152b27");
        rect(4,-6,5,7,"#152b27");
        rect(15,-14,4,29,"#aa783d");
        rect(19,-8,3,17,"#e5c28a");
    }

    if (t.type === 2) {
        rect(-20,-14,40,28,"#50b93b");
        rect(-13,-20,26,39,"#78df4a");
        rect(-25,-13,9,20,"#368e2d");
        rect(16,-13,9,20,"#368e2d");
        rect(-10,-10,6,7,"white");
        rect(4,-10,6,7,"white");
        rect(-8,-8,3,5,"#222");
        rect(6,-8,3,5,"#222");
        rect(-9,3,18,10,"#c6eb76");
    }

    if (t.type === 3) {
        rect(-5,0,10,22,"#76502e");
        rect(-18,-18,36,25,"#4e408e");
        rect(-12,-25,24,30,"#9364d8");
        rect(-5,-20,5,5,"#e5c9ff");
        rect(8,-8,5,5,"#e5c9ff");
    }

    ctx.fillStyle = "white";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText("Lv." + t.level,0,32);

    ctx.restore();
}

function draw() {
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            rect(x*TILE,y*TILE,TILE,TILE,
                (x+y)%2 ? "#639c49" : "#6aa34f");

            rect(x*TILE+8,y*TILE+12,3,6,"#50883d");
        }
    }

    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(path[0].x,path[0].y);

    for (const p of path) ctx.lineTo(p.x,p.y);

    ctx.strokeStyle = "#8c6a43";
    ctx.lineWidth = 48;
    ctx.stroke();

    ctx.strokeStyle = "#b99968";
    ctx.lineWidth = 38;
    ctx.stroke();

    // Forest crystal.
    ctx.fillStyle = "#9df9ff";
    ctx.beginPath();
    ctx.moveTo(936,407);
    ctx.lineTo(952,433);
    ctx.lineTo(936,457);
    ctx.lineTo(920,433);
    ctx.closePath();
    ctx.fill();

    for (const t of towers) drawTower(t);

    for (const e of enemies) {
        const s = e.boss ? 23 : 13;

        rect(e.x-s,e.y-s,s*2,s*2,
            e.boss ? "#803da5" : "#b83b43");

        rect(e.x-s+4,e.y-s+5,6,7,"white");
        rect(e.x+s-10,e.y-s+5,6,7,"white");

        rect(e.x-s,e.y-s-9,s*2,5,"#442323");
        rect(e.x-s,e.y-s-9,s*2*e.hp/e.maxHP,5,"#8bea54");
    }

    for (const b of bullets) {
        rect(b.x-4,b.y-4,8,8,b.color);
    }

    for (const p of particles) {
        ctx.globalAlpha = p.life/30;
        rect(p.x,p.y,4,4,p.color);
    }

    ctx.globalAlpha = 1;

    if (gameOver || victory) {
        rect(0,0,960,576,"#000b");
        ctx.fillStyle = victory ? "gold" : "#ff7676";
        ctx.font = "bold 44px monospace";
        ctx.textAlign = "center";
        ctx.fillText(
            victory ? "FOREST SAVED!" : "GAME OVER",
            480,270
        );
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
