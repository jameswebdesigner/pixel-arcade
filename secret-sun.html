
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borp & Blob - Solar Showdown</title>

<style>
body {
    margin: 0;
    background: #03030c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    color: orange;
    text-shadow: 0 0 25px orange;
    margin: 12px;
}

canvas {
    background: black;
    border: 3px solid orange;
    border-radius: 12px;
    box-shadow: 0 0 30px #ff660066;
    max-width: 95vw;
    max-height: 75vh;
    cursor: crosshair;
}

button {
    background: orange;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

p {
    color: #bbbbbb;
}
</style>
</head>

<body>

<h1>BORP & BLOB: THE SOLAR SHOWDOWN</h1>

<canvas id="game" width="900" height="550"></canvas>

<p>
WASD / Arrow Keys: Move |
Click: Fireball |
SPACE: Spread Attack
</p>

<button onclick="location.reload()">Restart</button>
<button onclick="location.href='secret-access.html'">Return to Portal</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const keys = {};

let frame = 0;
let stage = 1;
let novaPhase = 1;
let novaTimer = 0;
let explosionTimer = 0;

let gameOver = false;
let victory = false;

let shake = 0;
let flash = 0;
let fireCooldown = 0;
let spreadCooldown = 0;
let jumpCooldown = 0;
let jumpTimer = 0;
let spaceWasDown = false;
let sunAttackTimer = 0;

let bullets = [];
let arrows = [];
let solarBalls = [];
let shockwaves = [];
let rays = [];
let particles = [];

const borp = {
    x: 150,
    y: 380,
    width: 90,
    height: 75,
    speed: 4,
    health: 25,
    maxHealth: 25,
    flash: 0
};

const blob = {
    x: 750,
    y: 380,
    radius: 22,
    speed: 3.5,
    health: 20,
    maxHealth: 20,
    flash: 0,
    shootTimer: 0
};

const sun = {
    x: 450,
    y: 220,
    radius: 85,
    health: 60,
    maxHealth: 60,
    flash: 0
};

// SPACE BACKGROUND

const stars = [];

for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        brightness: Math.random()
    });
}

// CONTROLS

document.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (
        e.code === "Space" ||
        e.code.startsWith("Arrow")
    ) {
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

// BORP FIREBALL

canvas.addEventListener("mousedown", e => {

    if (
        gameOver ||
        victory ||
        stage >= 3 ||
        fireCooldown > 0
    ) return;

    const rect = canvas.getBoundingClientRect();

    const mx =
        (e.clientX - rect.left) *
        W / rect.width;

    const my =
        (e.clientY - rect.top) *
        H / rect.height;

    const angle = Math.atan2(
        my - borp.y,
        mx - borp.x
    );

    bullets.push({
        x: borp.x,
        y: borp.y,
        vx: Math.cos(angle) * 8,
        vy: Math.sin(angle) * 8,
        radius: 10
    });

    fireCooldown = 20;
});

// SPREAD ATTACK

function spreadAttack() {

    if (spreadCooldown > 0 || stage >= 3) return;

    spreadCooldown = 720;

    const angle = Math.atan2(
        sun.y - borp.y,
        sun.x - borp.x
    );

    for (let i = -3; i <= 3; i++) {

        const a = angle + i * 0.30;

        bullets.push({
            x: borp.x,
            y: borp.y,
            vx: Math.cos(a) * 6,
            vy: Math.sin(a) * 6,
            radius: 4
        });
    }
}

// EXPLOSION PARTICLES

function explode(x, y, color, amount) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 90,
            color,
            size: Math.random() * 6 + 2
        });
    }
}

// DAMAGE

function hurt(character, amount = 1) {
// Blob has escaped the supernova!
if (character === blob && stage >= 3) return;
    if (
        character.flash > 0 ||
        character.health <= 0 ||
        gameOver ||
        victory
    ) return;

    character.health = Math.max(
        0,
        character.health - amount
    );

    character.flash = 60;

    shake = 10;

    explode(
        character.x,
        character.y,
        "#ff4444",
        15
    );

    // BOTH HEROES MUST SURVIVE

    if (character.health <= 0) {
        gameOver = true;
    }
}

// DAMAGE THE SUN

function hurtSun(amount) {

    if (stage >= 3) return;

    sun.health -= amount;
    sun.flash = 6;

    if (sun.health <= 0 && stage === 1) {

        stage = 2;

        sun.health = 80;
        sun.maxHealth = 80;
        sun.radius = 100;

        sunAttackTimer = 0;

        shake = 30;

        explode(sun.x, sun.y, "orange", 100);

    } else if (sun.health <= 0 && stage === 2) {

        stage = 3;

        sun.health = 0;
        explosionTimer = 0;

        solarBalls = [];
        bullets = [];
        arrows = [];
        rays = [];

        // Give the heroes some health
        // before the survival challenge.

        borp.health = Math.min(
            borp.maxHealth,
            borp.health + 8
        );

        blob.health = Math.min(
            blob.maxHealth,
            blob.health + 8
        );
    }
}

// SUN FIREBALL ATTACK

function solarAttack() {

    const amount = stage === 1 ? 10 : 18;

    for (let i = 0; i < amount; i++) {

        const angle =
            i * Math.PI * 2 / amount +
            frame * 0.015;

        const speed = stage === 1 ? 3 : 4.5;

        solarBalls.push({
            x: sun.x + Math.cos(angle) * sun.radius,
            y: sun.y + Math.sin(angle) * sun.radius,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 9
        });
    }
}

// ROTATING SOLAR RAYS

function createRays(amount, speed) {

    rays = [];

    for (let i = 0; i < amount; i++) {

        rays.push({
            angle: i * Math.PI * 2 / amount,
            speed,
            warning: 90
        });
    }
}

function rayDistance(x, y, angle) {

    const dx = x - sun.x;
    const dy = y - sun.y;

    const forward =
        dx * Math.cos(angle) +
        dy * Math.sin(angle);

    if (forward < 0) return Infinity;

    return Math.abs(
        dx * Math.sin(angle) -
        dy * Math.cos(angle)
    );
}

// BORP MOVEMENT

function updateBorp() {

    let dx = 0;
    let dy = 0;

    if (keys.KeyW || keys.ArrowUp) dy--;
    if (keys.KeyS || keys.ArrowDown) dy++;
    if (keys.KeyA || keys.ArrowLeft) dx--;
    if (keys.KeyD || keys.ArrowRight) dx++;

    const length = Math.hypot(dx, dy);

    if (length > 0) {

        borp.x += dx / length * borp.speed;
        borp.y += dy / length * borp.speed;
    }

    if (jumpCooldown > 0) jumpCooldown--;

if (stage === 4 && novaPhase === 3) {

    if (keys.Space && !spaceWasDown && jumpCooldown === 0) {
        jumpTimer = 12;
        jumpCooldown = 30;
    }

    if (jumpTimer > 0) {

        const dx = borp.x - sun.x;
        const dy = borp.y - sun.y;
        const distance = Math.hypot(dx, dy) || 1;

        borp.x += dx / distance * 12;
        borp.y += dy / distance * 12;

        jumpTimer--;
    }

} else if (keys.Space) {
    spreadAttack();
}

spaceWasDown = !!keys.Space;
}

// FOREST BLOB TEAMMATE AI

function updateBlob() {
// RUN AWAY FROM THE SUPERNOVA!
if (stage >= 3) {
    const dx = blob.x - sun.x;
    const dy = blob.y - sun.y;
    const distance = Math.hypot(dx, dy) || 1;

    blob.x += dx / distance * 6;
    blob.y += dy / distance * 6;

    return;
}
    let moveX = 0;
    let moveY = 0;

    // Follow Borp, but leave room.

    const dx = borp.x - blob.x;
    const dy = borp.y - blob.y;
    const distance = Math.hypot(dx, dy);

    if (distance > 150) {

        moveX += dx / distance;
        moveY += dy / distance;
    }

    if (distance < 65 && distance > 0) {

        moveX -= dx / distance;
        moveY -= dy / distance;
    }

    // Stay away from the Sun.

    const sx = blob.x - sun.x;
    const sy = blob.y - sun.y;
    const sd = Math.hypot(sx, sy);

    if (sd < sun.radius + 75 && sd > 0) {

        moveX += sx / sd * 3;
        moveY += sy / sd * 3;
    }

    // Dodge solar fireballs.

    for (const ball of solarBalls) {

        const bx = blob.x - ball.x;
        const by = blob.y - ball.y;
        const bd = Math.hypot(bx, by);

        if (bd < 95 && bd > 0) {

            moveX += bx / bd * 2.5;
            moveY += by / bd * 2.5;
        }
    }

    // Dodge shockwaves.

    for (const wave of shockwaves) {

        if (Math.abs(sd - wave.radius) < 75 && sd > 0) {

            const direction =
                sd > wave.radius ? 1 : -1;

            moveX += sx / sd * direction * 3;
            moveY += sy / sd * direction * 3;
        }
    }

    // Dodge rotating rays.

    for (const ray of rays) {

        if (
            rayDistance(blob.x, blob.y, ray.angle) < 70
        ) {

            moveX += -Math.sin(ray.angle) * 3;
            moveY += Math.cos(ray.angle) * 3;
        }
    }

    // Escape the black hole!

    if (stage === 4 && novaPhase === 3 && sd > 0) {

        moveX += sx / sd * 8;
        moveY += sy / sd * 8;
    }

    const length = Math.hypot(moveX, moveY);

    if (length > 0) {

        blob.x += moveX / length * blob.speed;
        blob.y += moveY / length * blob.speed;
    }

    // Shoot arrows at the Sun.

    if (stage < 3) {

        blob.shootTimer++;

        if (blob.shootTimer >= 45) {

            blob.shootTimer = 0;

            const angle = Math.atan2(
                sun.y - blob.y,
                sun.x - blob.x
            );

            arrows.push({
                x: blob.x,
                y: blob.y,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                angle
            });
        }
    }
}

// SUPERNOVA ANIMATION

function updateExplosion() {

    explosionTimer++;

    shake = Math.min(35, explosionTimer / 5);

    if (explosionTimer === 150) {

        flash = 45;
        shake = 45;

        explode(sun.x, sun.y, "#ffffff", 150);
        explode(sun.x, sun.y, "#ff9900", 200);
        explode(sun.x, sun.y, "#ff3300", 150);
    }

    if (explosionTimer >= 240) {

        stage = 4;
        novaPhase = 1;
        novaTimer = 0;

        shake = 0;
    }
}

// SUPERNOVA SURVIVAL CHALLENGES

function updateSupernova() {

    novaTimer++;

    // PHASE 1: SHOCKWAVES

    if (novaPhase === 1) {

        if (novaTimer % 100 === 1) {

            shockwaves.push({
                radius: 0,
                speed: 3.5,
                hitBorp: false,
                hitBlob: false
            });
        }

        if (novaTimer >= 900) {

            novaPhase = 2;
            novaTimer = 0;
            shockwaves = [];

            createRays(5, 0.012);
        }
    }

    // PHASE 2: RAYS

    else if (novaPhase === 2) {

        if (novaTimer >= 900) {

            novaPhase = 3;
            novaTimer = 0;

            rays = [];
            solarBalls = [];

            shake = 25;
        }
    }

    // PHASE 3: BLACK HOLE

    else if (novaPhase === 3) {

        for (const hero of [borp]) {

            const dx = sun.x - hero.x;
            const dy = sun.y - hero.y;
            const distance = Math.hypot(dx, dy);

            const strength =
    5 +
    novaTimer / 900 * 1.5 +
    Math.max(0, 150 - distance) / 100;

            if (distance > 1) {

                hero.x += dx / distance * strength;
                hero.y += dy / distance * strength;
            }

            if (distance < 55) {

                hurt(hero, 2);

                if (distance > 1) {

                    hero.x -= dx / distance * 90;
                    hero.y -= dy / distance * 90;
                }
            }
        }

        if (novaTimer >= 900 && !gameOver) {

            victory = true;

            explode(sun.x, sun.y, "#ffffff", 150);
            explode(sun.x, sun.y, "#aa55ff", 150);
            explode(sun.x, sun.y, "#39ff14", 100);
        }
    }
}

// UPDATE PROJECTILES

function updateProjectiles() {

    for (const list of [bullets, arrows]) {

        for (let i = list.length - 1; i >= 0; i--) {

            const b = list[i];

            b.x += b.vx;
            b.y += b.vy;

            if (
                stage < 3 &&
                Math.hypot(b.x - sun.x, b.y - sun.y)
                < sun.radius
            ) {

                hurtSun(1);
                list.splice(i, 1);

            } else if (
                b.x < -50 ||
                b.x > W + 50 ||
                b.y < -50 ||
                b.y > H + 50
            ) {

                list.splice(i, 1);
            }
        }
    }

    for (let i = solarBalls.length - 1; i >= 0; i--) {

        const ball = solarBalls[i];

        ball.x += ball.vx;
        ball.y += ball.vy;

        let hit = false;

        for (const hero of [borp, blob]) {

            const radius = hero === borp ? 35 : 22;

            if (
                Math.hypot(
                    ball.x - hero.x,
                    ball.y - hero.y
                ) < radius + ball.radius
            ) {

                hurt(hero);
                hit = true;
                break;
            }
        }

        if (
            hit ||
            ball.x < -50 ||
            ball.x > W + 50 ||
            ball.y < -50 ||
            ball.y > H + 50
        ) {

            solarBalls.splice(i, 1);
        }
    }
}

// UPDATE SHOCKWAVES

function updateShockwaves() {

    for (let i = shockwaves.length - 1; i >= 0; i--) {

        const wave = shockwaves[i];

        wave.radius += wave.speed;

        const bd = Math.hypot(
            borp.x - sun.x,
            borp.y - sun.y
        );

        const fd = Math.hypot(
            blob.x - sun.x,
            blob.y - sun.y
        );

        if (
            Math.abs(bd - wave.radius) < 28 &&
            !wave.hitBorp
        ) {

            hurt(borp);
            wave.hitBorp = true;
        }

        if (
            Math.abs(fd - wave.radius) < 18 &&
            !wave.hitBlob
        ) {

            hurt(blob);
            wave.hitBlob = true;
        }

        if (wave.radius > 1100) {
            shockwaves.splice(i, 1);
        }
    }
}

// UPDATE RAYS

function updateRays() {

    for (const ray of rays) {

        ray.angle += ray.speed;

        if (ray.warning > 0) {

            ray.warning--;
            continue;
        }

        if (
            rayDistance(
                borp.x,
                borp.y,
                ray.angle
            ) < 27
        ) {

            hurt(borp);
        }

        if (
            rayDistance(
                blob.x,
                blob.y,
                ray.angle
            ) < 18
        ) {

            hurt(blob);
        }
    }
}

// MAIN UPDATE

function update() {

    if (gameOver || victory) return;

    frame++;

    if (borp.flash > 0) borp.flash--;
    if (blob.flash > 0) blob.flash--;
    if (sun.flash > 0) sun.flash--;
    if (fireCooldown > 0) fireCooldown--;
    if (spreadCooldown > 0) spreadCooldown--;
    if (shake > 0) shake--;
    if (flash > 0) flash--;

    updateBorp();
    updateBlob();

    if (stage < 3) {

        sunAttackTimer++;

        const interval = stage === 1 ? 110 : 75;

        if (sunAttackTimer % interval === 0) {

            solarAttack();
        }

        if (stage === 2 && rays.length === 0) {

            createRays(3, 0.008);
        }

        for (const hero of [borp, blob]) {

            if (
                Math.hypot(
                    hero.x - sun.x,
                    hero.y - sun.y
                ) < sun.radius + 25
            ) {

                hurt(hero);
            }
        }

    } else if (stage === 3) {

        updateExplosion();

    } else if (stage === 4) {

        updateSupernova();
    }

    updateProjectiles();
    updateShockwaves();
    updateRays();

    // Keep heroes inside the arena.

    for (const hero of (stage >= 3 ? [borp] : [borp, blob])) {

        const margin = hero === borp ? 50 : 25;

        hero.x = Math.max(
            margin,
            Math.min(W - margin, hero.x)
        );

        hero.y = Math.max(
            85,
            Math.min(H - margin, hero.y)
        );
    }
}

// DRAW BORP

function drawBorp() {

    ctx.save();

    ctx.translate(borp.x, borp.y);

    const wobble = Math.sin(frame / 18) * 0.12;
    const squish = Math.sin(frame / 18) * 0.12;

    ctx.rotate(wobble);
    ctx.scale(1 - squish / 2, 1 + squish);

    const color =
        borp.flash > 0 && borp.flash % 8 < 4
            ? "#ff3333"
            : "#39ff14";

    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;

    ctx.fillRect(-45, -37, 90, 75);

    ctx.shadowBlur = 0;

    // Walking legs

    const walking =
        keys.KeyW || keys.KeyA ||
        keys.KeyS || keys.KeyD ||
        keys.ArrowUp || keys.ArrowDown ||
        keys.ArrowLeft || keys.ArrowRight;

    const swing = walking
        ? Math.sin(frame / 5) * 10
        : 0;

    ctx.fillStyle = "black";

    ctx.fillRect(-25 + swing, 38, 18, 20);
    ctx.fillRect(10 - swing, 38, 18, 20);

    // Antennae

    ctx.strokeStyle = "#3b7406";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(-20, -35);
    ctx.lineTo(-27, -60);
    ctx.moveTo(20, -35);
    ctx.lineTo(27, -60);
    ctx.stroke();

    ctx.fillStyle = "#39ff14";

    ctx.beginPath();
    ctx.arc(-27, -60, 7, 0, Math.PI * 2);
    ctx.arc(27, -60, 7, 0, Math.PI * 2);
    ctx.fill();

    // Eyes

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-20, -12, 12, 0, Math.PI * 2);
    ctx.arc(20, -12, 12, 0, Math.PI * 2);
    ctx.fill();

    const ex = Math.max(
        -5,
        Math.min(5, (sun.x - borp.x) / 40)
    );

    const ey = Math.max(
        -5,
        Math.min(5, (sun.y - borp.y) / 40)
    );

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-20 + ex, -12 + ey, 5, 0, Math.PI * 2);
    ctx.arc(20 + ex, -12 + ey, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#39ff14";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("BORP (YOU)", borp.x, borp.y + 78);
}

// DRAW FOREST BLOB

function drawBlob() {

    ctx.save();
    ctx.translate(blob.x, blob.y);

    const swing = Math.sin(frame / 5) * 6;

    ctx.strokeStyle = "#126b52";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(-10, 14);
    ctx.lineTo(-13 + swing, 29);
    ctx.moveTo(10, 14);
    ctx.lineTo(13 - swing, 29);
    ctx.stroke();

    ctx.fillStyle =
        blob.flash > 0 && blob.flash % 8 < 4
            ? "#ff3333"
            : "#00ddbb";

    ctx.shadowColor = "#00ddbb";
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-8, -5, 6, 0, Math.PI * 2);
    ctx.arc(8, -5, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-8, -5, 3, 0, Math.PI * 2);
    ctx.arc(8, -5, 3, 0, Math.PI * 2);
    ctx.fill();

    // Bow

    ctx.rotate(
        Math.atan2(
            sun.y - blob.y,
            sun.x - blob.x
        )
    );

    ctx.strokeStyle = "#b87938";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.arc(10, 0, 19, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(10, -19);
    ctx.lineTo(10, 19);
    ctx.stroke();

    ctx.restore();

    ctx.fillStyle = "#00ddbb";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("BLOB", blob.x, blob.y + 45);
}

// DRAW THE ANGRY SUN

function drawSun() {

    if (stage >= 4) return;

    if (stage === 3 && explosionTimer >= 150) return;

    ctx.save();
    ctx.translate(sun.x, sun.y);

    let radius = sun.radius;

    if (stage === 3) {

        radius += explosionTimer * 0.5;

        ctx.translate(
            Math.random() * 12 - 6,
            Math.random() * 12 - 6
        );
    }

    // Animated solar flames

    for (let i = 0; i < 24; i++) {

        const angle =
            i * Math.PI * 2 / 24 +
            frame * 0.003;

        const flame =
            20 + Math.sin(frame / 10 + i) * 12;

        ctx.fillStyle = stage === 1
            ? "#ff8800"
            : "#ff3300";

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(angle - 0.10) * radius,
            Math.sin(angle - 0.10) * radius
        );

        ctx.lineTo(
            Math.cos(angle) * (radius + flame),
            Math.sin(angle) * (radius + flame)
        );

        ctx.lineTo(
            Math.cos(angle + 0.10) * radius,
            Math.sin(angle + 0.10) * radius
        );

        ctx.closePath();
        ctx.fill();
    }

    // Glowing body

    const gradient = ctx.createRadialGradient(
        -20, -20, 5,
        0, 0, radius
    );

    gradient.addColorStop(0, "#ffffaa");
    gradient.addColorStop(0.5, "#ffcc00");
    gradient.addColorStop(
        1,
        stage === 1 ? "#ff6600" : "#ff2200"
    );

    ctx.shadowColor = "#ff6600";
    ctx.shadowBlur = 40;

    ctx.fillStyle = sun.flash > 0
        ? "white"
        : gradient;

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Angry eyes

    ctx.fillStyle = "#660000";

    ctx.beginPath();
    ctx.ellipse(-30, -15, 16, 22, 0.3, 0, Math.PI * 2);
    ctx.ellipse(30, -15, 16, 22, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Angry eyebrows

    ctx.strokeStyle = "#660000";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.moveTo(-52, -43);
    ctx.lineTo(-12, -27);
    ctx.moveTo(52, -43);
    ctx.lineTo(12, -27);
    ctx.stroke();

    // Angry mouth

    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.arc(0, 42, 27, Math.PI, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

// DRAW SHOCKWAVES

function drawShockwaves() {

    for (const wave of shockwaves) {

        ctx.strokeStyle = "#ffbb33";
        ctx.shadowColor = "#ff6600";
        ctx.shadowBlur = 20;
        ctx.lineWidth = 10;

        ctx.beginPath();
        ctx.arc(
            sun.x,
            sun.y,
            wave.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.shadowBlur = 0;
    }
}

// DRAW RAYS

function drawRays() {

    for (const ray of rays) {

        ctx.save();

        ctx.translate(sun.x, sun.y);
        ctx.rotate(ray.angle);

        ctx.strokeStyle = ray.warning > 0
            ? "#ff330055"
            : "#ffdd55";

        ctx.lineWidth = ray.warning > 0 ? 5 : 24;

        ctx.shadowColor = "orange";
        ctx.shadowBlur = 20;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(1200, 0);
        ctx.stroke();

        if (ray.warning <= 0) {

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(1200, 0);
            ctx.stroke();
        }

        ctx.restore();
    }
}

// DRAW BLACK HOLE

function drawBlackHole() {

    if (
        stage !== 4 ||
        novaPhase !== 3 ||
        victory
    ) return;

    ctx.save();

    ctx.translate(sun.x, sun.y);

    // Swirling accretion disk

    for (let i = 0; i < 160; i++) {

        const angle =
            i * 0.25 +
            frame * 0.035;

        const radius =
            35 + i * 0.65;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        ctx.fillStyle = i % 3 === 0
            ? "#ffffff"
            : i % 2 === 0
                ? "#ff8800"
                : "#aa44ff";

        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Event horizon

    ctx.shadowColor = "#aa44ff";
    ctx.shadowBlur = 30;

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#cc88ff";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.restore();
}

// DRAW PROJECTILES

function drawProjectiles() {

    for (const b of bullets) {

        ctx.fillStyle = "#39ff14";
        ctx.shadowColor = "#39ff14";
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
    }

    for (const a of arrows) {

        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);

        ctx.strokeStyle = "#c48b50";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();

        ctx.fillStyle = "white";

        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(5, -5);
        ctx.lineTo(5, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    for (const ball of solarBalls) {

        ctx.fillStyle = "#ff6600";
        ctx.shadowColor = "#ff3300";
        ctx.shadowBlur = 20;

        ctx.beginPath();
        ctx.arc(
            ball.x,
            ball.y,
            ball.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffff88";

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// HEALTH BARS

function healthBar(x, y, width, hero, color, name) {

    ctx.textAlign = "left";
    ctx.font = "bold 14px Arial";
    ctx.fillStyle = "white";

    ctx.fillText(
        name + " " + hero.health + "/" + hero.maxHealth,
        x,
        y - 6
    );

    ctx.fillStyle = "#333333";
    ctx.fillRect(x, y, width, 14);

    ctx.fillStyle = color;

    ctx.fillRect(
        x,
        y,
        width * Math.max(0, hero.health / hero.maxHealth),
        14
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, width, 14);
}

// DRAW HUD

function drawHUD() {

    healthBar(20, 28, 200, borp, "#39ff14", "BORP");
    healthBar(680, 28, 200, blob, "#00ddbb", "BLOB");

    if (stage < 3) {

        healthBar(
            300,
            28,
            300,
            sun,
            "#ff6600",
            stage === 1 ? "THE SUN" : "SOLAR RAGE"
        );
    }

    ctx.textAlign = "center";
    ctx.font = "bold 20px Arial";

    if (stage === 3) {

        ctx.fillStyle = "orange";
        ctx.fillText("SUPERNOVA IMMINENT!", 450, 75);
    }

    if (stage === 4) {

        const names = [
            "",
            "SHOCKWAVES",
            "SOLAR RAYS",
            "BLACK HOLE"
        ];

        ctx.fillStyle = "#ffbb44";

        ctx.fillText(
            "SUPERNOVA PHASE " +
            novaPhase + ": " +
            names[novaPhase],
            450,
            28
        );

        ctx.fillStyle = "white";

        ctx.fillText(
            "SURVIVE: " +
            Math.max(0, Math.ceil((900 - novaTimer) / 60)) +
            "s",
            450,
            55
        );
    }

    if (stage < 3) {

        ctx.font = "bold 16px Arial";

        ctx.fillStyle = spreadCooldown === 0
            ? "#39ff14"
            : "#aaaaaa";

        ctx.fillText(
            spreadCooldown === 0
                ? "SPREAD ATTACK READY!"
                : "Spread recharge: " +
                  Math.ceil(spreadCooldown / 60) + "s",
            450,
            530
        );
    }
}

// MAIN DRAW

function draw() {

    ctx.fillStyle = "#03030c";
    ctx.fillRect(0, 0, W, H);

    // Twinkling stars

    for (const star of stars) {

        ctx.globalAlpha =
            0.4 +
            Math.sin(frame / 40 + star.brightness * 10) * 0.3;

        ctx.fillStyle = "white";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    }

    ctx.globalAlpha = 1;

    ctx.save();

    if (shake > 0 && !victory && !gameOver) {

        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );
    }

    drawSun();
    drawBlackHole();
    drawShockwaves();
    drawRays();
    drawProjectiles();

    drawBorp();
    drawBlob();

    // Explosion particles

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 90);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }

    ctx.globalAlpha = 1;

    ctx.restore();

    // Supernova white flash

    if (flash > 0) {

        ctx.globalAlpha = flash / 45;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    drawHUD();

    // END SCREEN

    if (victory || gameOver) {

        ctx.fillStyle = "#000000bb";
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = "center";

        ctx.font = "bold 45px Arial";

        ctx.fillStyle = victory
            ? "#39ff14"
            : "#ff4444";

        ctx.fillText(
            victory
                ? "THE UNIVERSE IS SAVED!"
                : "MISSION FAILED!",
            450,
            200
        );

        ctx.font = "bold 25px Arial";
        ctx.fillStyle = "white";

        ctx.fillText(
            victory
                ? "BORP & BLOB WIN!"
                : "The Sun was too powerful...",
            450,
            255
        );

        ctx.font = "22px Arial";

        ctx.fillText(
            victory
                ? "Enemies became heroes."
                : "Restart and try again!",
            450,
            305
        );

        ctx.fillStyle = "#ffcc00";

        ctx.fillText(
            victory ? "YIPPEEEEE!" : "",
            450,
            355
        );
    }
}

// GAME LOOP - 60 UPDATES PER SECOND

let lastTime = 0;
let accumulator = 0;

function gameLoop(time) {

    if (!lastTime) lastTime = time;

    accumulator += Math.min(time - lastTime, 100);

    lastTime = time;

    while (accumulator >= 1000 / 60) {

        update();
        accumulator -= 1000 / 60;
    }

    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
