<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roman vs Borp</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #11111c;
    color: white;
    text-align: center;
    font-family: monospace;
}

h1 {
    color: gold;
    text-shadow: 0 0 20px #d9a630;
}

canvas {
    background: #252530;
    border: 4px solid #777785;
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
}

button {
    background: #35354c;
    color: white;
    border: 2px solid #777795;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 6px;
    font: bold 15px monospace;
    cursor: pointer;
}

button:hover {
    background: #55557a;
}

#controls {
    color: #ccccdd;
    padding: 12px;
    line-height: 1.8;
}
</style>
</head>

<body>

<h1>⚔️ ROMAN VS BORP ⚔️</h1>

<canvas id="game" width="960" height="576"></canvas>

<div id="controls">
    WASD / Arrows: Move |
    SPACE: Sword Attack |
    SHIFT: Dodge |
    E: Shield |
    Q: Health Potion
</div>

<button onclick="location.reload()">Retry Battle</button>

<button onclick="location.href='secret-access.html'">
    Return to Portal
</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const keys = {};

let frame = 0;
let phase = 1;
let potions = 5;

let gameOver = false;
let victory = false;

let attackCooldown = 0;
let attackAnimation = 0;
let dodgeCooldown = 0;
let dodgeTimer = 0;
let hurtTimer = 0;

let bossTimer = 0;
let transitionTimer = 120;
let defeatTimer = 0;
let shake = 0;

let fireballs = [];
let meteors = [];
let shockwaves = [];
let lightning = [];
let particles = [];

const roman = {
    x: 180,
    y: 300,
    health: 150,
    maxHealth: 150,
    direction: 1,
    aimX: 1,
    aimY: 0,
    moving: false
};

const borp = {
    x: 750,
    y: 280,
    health: 250,
    maxHealth: 250,
    speed: 1.7,
    flash: 0,
    contactCooldown: 0
};

const phaseNames = [
    "",
    "GREEN BORP",
    "PURPLE BORP",
    "GOLDEN BORP"
];

const phaseColors = [
    "",
    "#69d447",
    "#a85be3",
    "#ffd43b"
];

window.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    keys[key] = true;

    if (
        [" ","arrowup","arrowdown",
         "arrowleft","arrowright"].includes(key)
    ) {
        e.preventDefault();
    }

    if (e.repeat) return;

    if (key === " ") attack();
    if (key === "shift") dodge();
    if (key === "q") heal();

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});

window.addEventListener("blur", () => {

    for (const key in keys) keys[key] = false;

});

function rect(x,y,w,h,color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        w,h
    );

}

function burst(x,y,color,count) {

    for (let i = 0; i < count; i++) {

        particles.push({
            x,
            y,
            color,
            vx: (Math.random()-.5)*9,
            vy: (Math.random()-.5)*9,
            life: 40
        });

    }

}

function clampCharacter(character,margin) {

    character.x = Math.max(
        margin,
        Math.min(W-margin,character.x)
    );

    character.y = Math.max(
        130,
        Math.min(H-margin,character.y)
    );

}

function attack() {

    if (
        attackCooldown > 0 ||
        transitionTimer > 0 ||
        defeatTimer > 0 ||
        gameOver ||
        victory ||
        keys.e
    ) return;

    attackCooldown = 25;
    attackAnimation = 12;

    const distance = Math.hypot(
        borp.x-roman.x,
        borp.y-roman.y
    );

    if (distance < 110) {

        borp.health -= 25;

        borp.flash = 10;

        shake = 5;

        burst(
            borp.x,
            borp.y,
            "#fff0a0",
            18
        );

        if (borp.health <= 0) {

            nextPhase();

        }

    }

}

function dodge() {

    if (
        dodgeCooldown > 0 ||
        gameOver ||
        victory ||
        transitionTimer > 0 ||
        defeatTimer > 0
    ) return;

    dodgeTimer = 14;
    dodgeCooldown = 100;

    burst(
        roman.x,
        roman.y,
        "#7eb8ff",
        15
    );

}

function heal() {

    if (
        potions <= 0 ||
        roman.health >= roman.maxHealth ||
        gameOver ||
        victory ||
        defeatTimer > 0
    ) return;

    potions--;

    roman.health = Math.min(
        roman.maxHealth,
        roman.health+45
    );

    burst(
        roman.x,
        roman.y,
        "#ff66bb",
        35
    );

}

function hurtRoman(amount) {

    if (
        hurtTimer > 0 ||
        dodgeTimer > 0 ||
        transitionTimer > 0 ||
        defeatTimer > 0 ||
        gameOver ||
        victory
    ) return;

    if (keys.e) {

        amount = Math.ceil(amount*.2);

        burst(
            roman.x,
            roman.y,
            "#99ddff",
            12
        );

    } else {

        burst(
            roman.x,
            roman.y,
            "#ff4444",
            15
        );

    }

    roman.health -= amount;

    hurtTimer = 45;
    shake = 8;

    if (roman.health <= 0) {

        roman.health = 0;
        gameOver = true;

    }

}

function nextPhase() {

    fireballs = [];
    meteors = [];
    shockwaves = [];
    lightning = [];

    burst(
        borp.x,
        borp.y,
        phaseColors[phase],
        100
    );

    shake = 25;

    if (phase === 3) {

        borp.health = 0;
        defeatTimer = 180;

        return;

    }

    phase++;

    transitionTimer = 150;

    borp.maxHealth = phase === 2 ? 350 : 500;
    borp.health = borp.maxHealth;
    borp.speed = phase === 2 ? 2.2 : 2.7;

    borp.x = 750;
    borp.y = 280;

    roman.x = 180;
    roman.y = 300;

    roman.health = Math.min(
        roman.maxHealth,
        roman.health+25
    );

    bossTimer = 0;

}

function shootFireball() {

    const angle = Math.atan2(
        roman.y-borp.y,
        roman.x-borp.x
    );

    const count = phase === 1 ? 1 : 5;

    for (let i = 0; i < count; i++) {

        const a = angle+(i-(count-1)/2)*.22;

        fireballs.push({
            x: borp.x,
            y: borp.y,
            vx: Math.cos(a)*4.5,
            vy: Math.sin(a)*4.5,
            radius: 10
        });

    }

}

function stomp() {

    shockwaves.push({
        x: borp.x,
        y: borp.y,
        radius: 30,
        speed: phase === 3 ? 5 : 3,
        hit: false
    });

    shake = 15;

    burst(
        borp.x,
        borp.y,
        phaseColors[phase],
        25
    );

}

function meteorShower() {

    for (let i = 0; i < 8; i++) {

        meteors.push({
            x: i === 0
                ? roman.x
                : 60+Math.random()*(W-120),

            y: i === 0
                ? roman.y
                : 150+Math.random()*(H-210),

            timer: 85+i*5,
            radius: 45,
            hit: false
        });

    }

}

function lightningAttack() {

    for (let i = 0; i < 6; i++) {

        lightning.push({
            x: i === 0
                ? roman.x
                : 50+Math.random()*(W-100),

            timer: 80+i*8,
            width: 42,
            hit: false
        });

    }

}

function updateRoman() {

    if (attackCooldown > 0) attackCooldown--;
    if (attackAnimation > 0) attackAnimation--;
    if (dodgeCooldown > 0) dodgeCooldown--;
    if (dodgeTimer > 0) dodgeTimer--;
    if (hurtTimer > 0) hurtTimer--;

    let dx = 0;
    let dy = 0;

    if (keys.w || keys.arrowup) dy--;
    if (keys.s || keys.arrowdown) dy++;
    if (keys.a || keys.arrowleft) dx--;
    if (keys.d || keys.arrowright) dx++;

    const distance = Math.hypot(dx,dy);

    roman.moving = distance > 0;

    if (distance > 0 && dodgeTimer === 0) {

        roman.aimX = dx/distance;
        roman.aimY = dy/distance;

        if (dx !== 0) {

            roman.direction = Math.sign(dx);

        }

    }

    const speed = dodgeTimer > 0
        ? 10
        : keys.e ? 1.5 : 3.8;

    if (distance > 0 || dodgeTimer > 0) {

        roman.x += roman.aimX*speed;
        roman.y += roman.aimY*speed;

    }

    clampCharacter(roman,35);

    if (keys[" "]) attack();

}

function updateBorp() {

    if (borp.flash > 0) borp.flash--;

    if (borp.contactCooldown > 0) {

        borp.contactCooldown--;

    }

    const dx = roman.x-borp.x;
    const dy = roman.y-borp.y;
    const distance = Math.hypot(dx,dy) || 1;

    if (distance > 55) {

        borp.x += dx/distance*borp.speed;
        borp.y += dy/distance*borp.speed;

    }

    clampCharacter(borp,55);

    if (
        distance < 65 &&
        borp.contactCooldown <= 0
    ) {

        hurtRoman(12+phase*3);

        borp.contactCooldown = 60;

    }

    bossTimer++;

    if (phase === 1) {

        if (bossTimer%100 === 0) shootFireball();

        if (bossTimer%220 === 0) stomp();

    }

    if (phase === 2) {

        if (bossTimer%90 === 0) shootFireball();

        if (bossTimer%250 === 0) meteorShower();

    }

    if (phase === 3) {

        if (bossTimer%80 === 0) shootFireball();

        if (bossTimer%150 === 0) stomp();

        if (bossTimer%280 === 0) lightningAttack();

    }

}

function updateAttacks() {

    // Fireballs.

    for (let i = fireballs.length-1; i >= 0; i--) {

        const b = fireballs[i];

        b.x += b.vx;
        b.y += b.vy;

        if (
            Math.hypot(
                b.x-roman.x,
                b.y-roman.y
            ) < 25
        ) {

            hurtRoman(12);

            fireballs.splice(i,1);

        } else if (
            b.x < -30 ||
            b.x > W+30 ||
            b.y < -30 ||
            b.y > H+30
        ) {

            fireballs.splice(i,1);

        }

    }

    // Shockwaves.

    for (let i = shockwaves.length-1; i >= 0; i--) {

        const s = shockwaves[i];

        s.radius += s.speed;

        const distance = Math.hypot(
            roman.x-s.x,
            roman.y-s.y
        );

        if (
            !s.hit &&
            Math.abs(distance-s.radius) < 22
        ) {

            hurtRoman(18);

            s.hit = true;

        }

        if (s.radius > 1200) {

            shockwaves.splice(i,1);

        }

    }

    // Meteors.

    for (let i = meteors.length-1; i >= 0; i--) {

        const m = meteors[i];

        m.timer--;

        if (m.timer === 0) {

            shake = 15;

            burst(m.x,m.y,"#ff7733",40);

        }

        if (
            m.timer <= 0 &&
            !m.hit &&
            Math.hypot(
                roman.x-m.x,
                roman.y-m.y
            ) < m.radius+12
        ) {

            hurtRoman(22);

            m.hit = true;

        }

        if (m.timer < -20) {

            meteors.splice(i,1);

        }

    }

    // Lightning.

    for (let i = lightning.length-1; i >= 0; i--) {

        const l = lightning[i];

        l.timer--;

        if (l.timer === 0) shake = 18;

        if (
            l.timer <= 0 &&
            !l.hit &&
            Math.abs(roman.x-l.x) < l.width/2+12
        ) {

            hurtRoman(25);

            l.hit = true;

        }

        if (l.timer < -15) {

            lightning.splice(i,1);

        }

    }

}

function updateParticles() {

    for (let i = particles.length-1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .98;
        p.vy *= .98;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i,1);

        }

    }

}

function update() {

    if (gameOver || victory) return;

    frame++;

    if (shake > 0) shake *= .85;

    updateParticles();

    if (defeatTimer > 0) {

        defeatTimer--;

        if (defeatTimer%10 === 0) {

            burst(
                borp.x,
                borp.y,
                "#ffd700",
                25
            );

        }

        if (defeatTimer === 0) {

            victory = true;

            try {

                localStorage.setItem(
                    "boss2Victory",
                    "true"
                );

            } catch {}

        }

        return;

    }

    if (transitionTimer > 0) {

        transitionTimer--;

        return;

    }

    updateRoman();

    if (
        transitionTimer > 0 ||
        defeatTimer > 0
    ) return;

    updateBorp();
    updateAttacks();

}

function drawArena() {

    for (let y = 0; y < H; y += 48) {

        for (let x = 0; x < W; x += 48) {

            rect(
                x,y,48,48,
                (x/48+y/48)%2
                    ? "#383843"
                    : "#30303b"
            );

            ctx.strokeStyle = "#24242e";
            ctx.strokeRect(x,y,48,48);

        }

    }

    rect(0,0,W,95,"#191922");
    rect(0,95,W,10,"#777785");

    // Arena pillars and torches.

    for (let x = 50; x < W; x += 170) {

        rect(x-15,65,30,35,"#555561");
        rect(x-20,60,40,10,"#777783");

        ctx.shadowColor = "#ff8c22";
        ctx.shadowBlur = 25;

        rect(
            x-7,
            40+Math.sin(frame*.2+x)*5,
            14,22,
            "#ff7722"
        );

        rect(x-4,49,8,13,"#ffdd55");

        ctx.shadowBlur = 0;

    }

    // Central arena emblem.

    ctx.strokeStyle = "#585866";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.arc(W/2,340,175,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(W/2,340,155,0,Math.PI*2);
    ctx.stroke();

}

function drawRoman() {

    if (hurtTimer > 0 && frame%10 < 5) return;

    ctx.save();

    ctx.translate(roman.x,roman.y);
    ctx.scale(roman.direction,1);

    const walk = roman.moving
        ? Math.sin(frame*.25)*4
        : 0;

    // Shadow.

    rect(-18,23,36,6,"#171720");

    // Blue cape.

    rect(-23,-10,15,35,"#2445a5");
    rect(-26,0,10,30,"#3869e0");

    // Legs.

    rect(-12,12,10,17+walk,"#697381");
    rect(3,12,10,17-walk,"#87929f");

    // Silver armor.

    rect(-16,-12,32,28,"#8795a5");
    rect(-12,-10,24,23,"#c2ccd6");
    rect(-10,-8,20,5,"#f1f5f9");

    // Belt.

    rect(-16,9,32,5,"#59432e");
    rect(-4,8,8,7,"gold");

    // Helmet.

    rect(-15,-32,30,25,"#a3b1c1");
    rect(-11,-37,22,30,"#cbd5df");
    rect(-10,-33,5,15,"#ffffff");

    // Visor.

    rect(-12,-23,26,8,"#222733");
    rect(2,-21,9,3,"#75d5ff");

    // Blue plume.

    rect(-4,-45,8,10,"#3468db");
    rect(-15,-48,19,6,"#4a82ff");

    // Shield.

    rect(-26,-8,15,28,"#c3d0dc");
    rect(-23,-5,9,22,"#315cbb");
    rect(-20,0,3,13,"gold");

    // Legendary sword.

    ctx.save();

    ctx.translate(20,0);

    ctx.rotate(
        attackAnimation > 0
            ? -2+(12-attackAnimation)*.3
            : .5
    );

    ctx.shadowColor = "gold";
    ctx.shadowBlur = 15;

    rect(-4,-48,8,45,"#ffdd55");
    rect(-2,-45,3,40,"#fff9c7");

    ctx.shadowBlur = 0;

    rect(-12,-5,24,6,"#d8a12d");
    rect(-4,1,8,14,"#795131");

    ctx.restore();
    ctx.restore();

    if (attackAnimation > 0) {

        ctx.strokeStyle = "#ffe68b";
        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.arc(
            roman.x,
            roman.y,
            95,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    if (keys.e || dodgeTimer > 0) {

        ctx.strokeStyle = "#77ccff";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            roman.x,
            roman.y,
            40,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.fillStyle = "white";
    ctx.font = "bold 13px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
        "ROMAN",
        roman.x,
        roman.y+48
    );

}

function drawBorp() {

    ctx.save();

    ctx.translate(borp.x,borp.y);

    if (defeatTimer > 0) {

        const size = defeatTimer/180;

        ctx.scale(size,size);

        ctx.rotate((180-defeatTimer)*.06);

    }

    const bob = Math.sin(frame*.09)*4;

    ctx.translate(0,bob);

    const color = borp.flash > 0
        ? "#ffffff"
        : phaseColors[phase];

    const darkColor = phase === 1
        ? "#368c32"
        : phase === 2
        ? "#65369e"
        : "#b98216";

    if (phase === 3) {

        ctx.shadowColor = "gold";
        ctx.shadowBlur = 25;

    }

    // Shadow.

    rect(-45,40,90,12,"#181820");

    // Wings.

    rect(-65,-18,25,40,darkColor);
    rect(40,-18,25,40,darkColor);

    rect(-73,-28,18,25,color);
    rect(55,-28,18,25,color);

    // Walking legs.

    const walk = Math.sin(frame*.17)*6;

    rect(-31,30,22,25+walk,darkColor);
    rect(9,30,22,25-walk,darkColor);

    // Borp body.

    rect(-45,-30,90,65,darkColor);
    rect(-38,-38,76,72,color);
    rect(-45,-22,90,45,color);

    // Belly.

    rect(-20,4,40,28,
        phase === 3 ? "#fff0a0" : "#d4e98a"
    );

    // Horns.

    rect(-33,-53,12,22,"#e6d6aa");
    rect(21,-53,12,22,"#e6d6aa");

    // Eyes.

    rect(-25,-23,18,20,"white");
    rect(7,-23,18,20,"white");

    const look = roman.x < borp.x ? -4 : 4;

    rect(-19+look,-17,7,11,"#222");
    rect(13+look,-17,7,11,"#222");

    // Mouth.

    rect(-14,-1,28,8,"#263024");
    rect(-10,-1,5,5,"white");
    rect(5,-1,5,5,"white");

    ctx.shadowBlur = 0;

    // Golden crown.

    if (phase === 3) {

        rect(-24,-60,48,12,"#e6aa22");

        for (let i = 0; i < 3; i++) {

            rect(
                -24+i*18,
                -72,
                12,17,
                "#ffe35b"
            );

        }

        rect(-5,-59,10,8,"#ef4455");

    }

    ctx.restore();

}

function drawAttacks() {

    for (const b of fireballs) {

        ctx.shadowColor = "#ff5522";
        ctx.shadowBlur = 20;

        ctx.fillStyle = "#ff7733";

        ctx.beginPath();
        ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#ffed88";

        ctx.beginPath();
        ctx.arc(b.x,b.y,5,0,Math.PI*2);
        ctx.fill();

        ctx.shadowBlur = 0;

    }

    for (const s of shockwaves) {

        ctx.strokeStyle = phaseColors[phase];
        ctx.lineWidth = 12;

        ctx.beginPath();

        ctx.arc(
            s.x,s.y,s.radius,
            0,Math.PI*2
        );

        ctx.stroke();

    }

    for (const m of meteors) {

        ctx.fillStyle = m.timer > 0
            ? "rgba(255,50,50,.25)"
            : "rgba(255,150,40,.85)";

        ctx.strokeStyle = "#ff5555";
        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            m.x,m.y,m.radius,
            0,Math.PI*2
        );

        ctx.fill();
        ctx.stroke();

        if (m.timer > 0) {

            ctx.fillStyle = "white";
            ctx.font = "bold 24px monospace";
            ctx.textAlign = "center";

            ctx.fillText("!",m.x,m.y+8);

        }

    }

    for (const l of lightning) {

        if (l.timer > 0) {

            rect(
                l.x-l.width/2,
                105,
                l.width,
                H-105,
                "rgba(255,50,50,.25)"
            );

        } else {

            ctx.shadowColor = "gold";
            ctx.shadowBlur = 30;

            rect(
                l.x-l.width/2,
                105,
                l.width,
                H-105,
                "#ffe34f"
            );

            rect(
                l.x-5,
                105,
                10,
                H-105,
                "white"
            );

            ctx.shadowBlur = 0;

        }

    }

}

function healthBar(x,y,width,value,max,color) {

    rect(x,y,width,20,"#171720");

    rect(
        x,y,
        width*Math.max(0,value/max),
        20,color
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.strokeRect(x,y,width,20);

    ctx.fillStyle = "white";
    ctx.font = "bold 13px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
        Math.ceil(value)+"/"+max,
        x+width/2,
        y+15
    );

}

function drawHUD() {

    rect(0,0,W,95,"#151520");

    ctx.font = "bold 18px monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = "#88bbff";

    ctx.fillText("ROMAN",25,24);

    healthBar(
        25,32,300,
        roman.health,
        roman.maxHealth,
        "#d94747"
    );

    ctx.font = "14px monospace";
    ctx.textAlign = "left";

    ctx.fillStyle = "white";

    ctx.fillText(
        "Potions: "+potions,
        25,75
    );

    ctx.fillText(
        dodgeCooldown === 0
            ? "Dodge: READY"
            : "Dodge: "+Math.ceil(dodgeCooldown/60)+"s",
        155,75
    );

    ctx.textAlign = "right";
    ctx.font = "bold 18px monospace";

    ctx.fillStyle = phaseColors[phase];

    ctx.fillText(
        phaseNames[phase],
        W-25,24
    );

    healthBar(
        W-325,32,300,
        borp.health,
        borp.maxHealth,
        phaseColors[phase]
    );

    ctx.textAlign = "right";
    ctx.fillStyle = "white";
    ctx.font = "14px monospace";

    ctx.fillText(
        "Phase "+phase+"/3",
        W-25,75
    );

}

function draw() {

    ctx.clearRect(0,0,W,H);

    ctx.save();

    if (shake > 1) {

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }

    drawArena();

    drawAttacks();

    drawBorp();

    drawRoman();

    for (const p of particles) {

        ctx.globalAlpha = p.life/40;

        rect(p.x,p.y,5,5,p.color);

    }

    ctx.globalAlpha = 1;

    ctx.restore();

    drawHUD();

    if (transitionTimer > 0) {

        rect(0,105,W,H-105,"#0008");

        ctx.textAlign = "center";
        ctx.font = "bold 44px monospace";
        ctx.fillStyle = phaseColors[phase];

        ctx.fillText(
            "PHASE "+phase,
            W/2,270
        );

        ctx.font = "bold 30px monospace";

        ctx.fillText(
            phaseNames[phase],
            W/2,320
        );

    }

    if (defeatTimer > 0) {

        ctx.textAlign = "center";
        ctx.font = "bold 35px monospace";
        ctx.fillStyle = "gold";

        ctx.fillText(
            "BORP HAS BEEN DEFEATED!",
            W/2,160
        );

    }

    if (gameOver || victory) {

        rect(0,0,W,H,"#000d");

        ctx.textAlign = "center";
        ctx.font = "bold 48px monospace";

        ctx.fillStyle = victory
            ? "gold"
            : "#ff5555";

        ctx.fillText(
            victory
                ? "LEGENDARY VICTORY!"
                : "ROMAN HAS FALLEN",
            W/2,220
        );

        ctx.font = "bold 24px monospace";
        ctx.fillStyle = "white";

        ctx.fillText(
            victory
                ? "All three forms of Borp defeated!"
                : "Retry the battle!",
            W/2,280
        );

        if (victory) {

            ctx.font = "bold 22px monospace";

            ctx.fillText(
                "NEW SECRET PORTAL CODE",
                W/2,355
            );

            ctx.shadowColor = "gold";
            ctx.shadowBlur = 25;

            ctx.fillStyle = "gold";
            ctx.font = "bold 65px monospace";

            ctx.fillText(
                "BOSS3",
                W/2,435
            );

            ctx.shadowBlur = 0;

        }

    }

}

let previousTime = performance.now();
let accumulator = 0;

function loop(now) {

    accumulator += Math.min(
        now-previousTime,
        100
    );

    previousTime = now;

    while (accumulator >= 1000/60) {

        update();

        accumulator -= 1000/60;

    }

    draw();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
