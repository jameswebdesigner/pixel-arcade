
<!DOCTYPE html>
<html>
<head>
    <title>Secret Access Portal</title>






    <style>
        :root {
    --portal-color: #555566;
    --energy-color: #222233;
    --portal-size: min(85vw, 85vh);
}
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: cyan;
            text-shadow: 0 0 10px cyan,
                         0 0 25px cyan;
        }

        input {
            background: #111;
            color: white;
            border: 2px solid cyan;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            text-align: center;
        }

        button {
            background: black;
            color: cyan;
            border: 2px solid cyan;
            padding: 12px 30px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 25px cyan;
        }
        /* PORTAL DESIGN */

.portal {
    position: fixed;
    top: 50%;
    left: 50%;
    width: var(--portal-size);
    height: var(--portal-size);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
}

.portal-core {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        black 15%,
        var(--energy-color) 50%,
        var(--portal-color) 70%,
        transparent 75%
    );
}

.portal-ring {
    position: absolute;
    inset: 0;
    border: 5px dashed var(--portal-color);
    border-radius: 50%;
    animation: spin 15s linear infinite;
}

.inner-ring {
    inset: 25px;
    border: 8px dotted var(--portal-color);
    animation: spin 8s linear infinite reverse;
}

body > :not(.portal):not(script):not(.particle) {
    position: relative;
    z-index: 1;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes pulse {
    from {
        transform: scale(0.95);
    }
    to {
        transform: scale(1.05);
    }
}
        /* PORTAL ACTIVATION */

.portal-core {
    opacity: 0.3;
    transition: 1s;
    animation: none;
}

.portal-ring {
    transition: box-shadow 1s, border-color 1s;
}

.portal.active .portal-core {
    opacity: 1;
    animation: pulse 0.5s infinite alternate;
}

.portal.active .portal-ring {
    animation-duration: 2s;
    box-shadow:
        0 0 30px var(--portal-color),
        0 0 70px var(--portal-color),
        inset 0 0 60px var(--portal-color);
}

.portal.active .inner-ring {
    animation-duration: 1s;
}
/* Portal travel animation */

.portal.active {
    animation: portalTravel 3s ease-in forwards;
}

@keyframes portalTravel {
    0% {
        transform: translate(-50%, -50%) scale(1);
    }

    40% {
        transform: translate(-50%, -50%) scale(1.1);
    }

    100% {
        transform: translate(-50%, -50%) scale(5);
    }
}

body {
    overflow: hidden;
}
/* ELECTRIC PORTAL ENERGY */

.portal.active::before,
.portal.active::after {
    content: "";
    position: absolute;
    inset: -15px;
    border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: var(--portal-color);
    border-bottom-color: var(--portal-color);

    filter: drop-shadow(0 0 12px var(--portal-color));

    animation: electricEnergy 0.6s linear infinite;
}

.portal.active::after {
    inset: -30px;
    animation-duration: 0.9s;
    animation-direction: reverse;
}

@keyframes electricEnergy {
    0% {
        transform: rotate(0deg) scale(1);
    }

    50% {
        transform: rotate(180deg) scale(1.08);
    }

    100% {
        transform: rotate(360deg) scale(1);
    }
}
/* PORTAL ENERGY PARTICLES */

.particle {
    position: fixed;
    top: calc(50% - 2.5px);
left: calc(50% - 2.5px);
    width: 5px;
    height: 5px;
    background: var(--portal-color);
    border-radius: 50%;
    box-shadow: 0 0 15px var(--portal-color);
    pointer-events: none;
    z-index: 2;

    animation: absorbParticle 1.5s linear infinite;
}

@keyframes absorbParticle {
    0% {
        transform: translate(var(--x), var(--y)) scale(1);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translate(0, 0) scale(0);
        opacity: 0;
    }
}
/* SCREEN SHAKE */

body.traveling {
    animation: screenShake 0.15s linear 8;
}

@keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(3px, -3px); }
    50% { transform: translate(-3px, 3px); }
    75% { transform: translate(3px, 3px); }
}

/* DIMENSION FADE */

body.traveling::after {
    content: "";
    position: fixed;
    inset: 0;
    background: var(--portal-color);
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    animation: dimensionFade 3s forwards;
}

@keyframes dimensionFade {
    0%, 65% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }
}
    </style>
</head>










<body>
<div class="portal">
    <div class="portal-core"></div>
    <div class="portal-ring"></div>
    <div class="portal-ring inner-ring"></div>
</div>
    <h1>SECRET ACCESS PORTAL</h1>
    <p>One portal. Many secrets.</p>

    <input id="accessCode" placeholder="Enter access code">

    <button onclick="checkCode()">UNLOCK</button>

    <p id="message"></p>

    <script>

        // ==============================
        // CUSTOMIZE YOUR SECRET CODES HERE
        // ==============================

        const secretCodes = [
    {
        code: "FOREST",
        page: "forest-q.html",
        color: "#00ff66",
        name: "Forest Dimension"
    },
    {
        code: "PIXEL",
        page: "platformer.html",
        color: "#00bbff",
        name: "Pixel Dimension"
    },
    {
        code: "BOSS",
        page: "secret-boss.html",
        color: "#ff3300",
        name: "Boss Dimension"
    },
    {
        code: "DEV",
        page: "developer.html",
        color: "#bd55ff",
        name: "Developer Dimension"
    }
];

        // ==============================
        // ACCESS SYSTEM - DO NOT CHANGE
        // ==============================

        function checkCode() {
    const input = document.getElementById("accessCode");
    const message = document.getElementById("message");
    const portal = document.querySelector(".portal");

    if (input.disabled) return;

    const enteredCode = input.value.trim().toUpperCase();

    const match = secretCodes.find(
        item => item.code.toUpperCase() === enteredCode
    );

    if (match) {
        document.documentElement.style.setProperty(
            "--portal-color", match.color
        );

        document.documentElement.style.setProperty(
            "--energy-color", match.color
        );

        portal.classList.add("active");
        document.body.classList.add("traveling");
        // Create energy particles
for (let i = 0; i < 60; i++) {
    const particle = document.createElement("div");

    particle.className = "particle";

    const angle = Math.random() * Math.PI * 2;
    const distance = 300 + Math.random() * 600;

    particle.style.setProperty(
        "--x", Math.cos(angle) * distance + "px"
    );

    particle.style.setProperty(
        "--y", Math.sin(angle) * distance + "px"
    );

    particle.style.animationDelay =
        Math.random() * 1.5 + "s";

    document.body.appendChild(particle);
}

        message.style.color = match.color;
        message.textContent = "OPENING " + match.name + "...";

        input.disabled = true;
        document.querySelector("button").disabled = true;

        setTimeout(() => {
            window.location.href = match.page;
        }, 3000);

    } else {
        message.style.color = "red";
        message.textContent = "ACCESS DENIED";
    }
}

        document.getElementById("accessCode")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    checkCode();
                }
            });

    </script>

</body>
</html>
