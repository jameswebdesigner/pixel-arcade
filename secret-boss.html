
<!DOCTYPE html>
<html>
<head>
    <title>Battle of the Dimensions</title>

    <style>
        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #ff4444;
            text-shadow: 0 0 20px red;
            letter-spacing: 4px;
        }

        canvas {
            display: block;
            margin: auto;
            width: 95%;
            max-width: 900px;
            background: #170b10;
            border: 3px solid #ff3333;
            border-radius: 10px;
            box-shadow: 0 0 35px #ff000066;
            cursor: crosshair;
            touch-action: none;
        }

        button {
            background: black;
            color: white;
            border: 2px solid red;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: red;
            box-shadow: 0 0 20px red;
        }

        p {
            color: #aaaaaa;
        }
    </style>
</head>

<body>

<h1>BATTLE OF THE DIMENSIONS</h1>

<p>FOREST BLOB VS BORP</p>

<canvas id="game" width="900" height="550"></canvas>

<p>WASD / Arrow Keys: Move | Mouse: Aim and Shoot | Space: Dodge</p>

<button onclick="resetGame()">RESTART</button>

<button onclick="location.href='secret-access.html'">
    EXIT PORTAL
</button>

<script>

// ==========================================
// CUSTOMIZE YOUR BOSS FIGHT HERE!
// ==========================================

const settings = {
    playerColor: "#008d4b",
    playerHealth: 5,
    playerSpeed: 3.5,

    bossName: "BORP",
    bossColor: "#55bb33",
    bossHealth: 15,
    // PHASE TWO SETTINGS
phaseTwoHealth: 20,
phaseTwoColor: "#a020ff",
phaseTwoSpeed: 2.2,

fireballDelay: 5000,
fireballSpeed: 5,
fireballSize: 25,

meteorAmount: 8,
meteorWarningTime: 1000,

lavaSize: 35,
lavaDuration: 3000,

screenShakeDuration: 500,
screenShakeStrength: 8,
    bossSpeed: 1.3,

    arrowDamage: 1,
    arrowSpeed: 9,

    enemyBulletSpeed: 3.5,
    bossAttackDelay: 1100,

    dodgeSpeed: 11,
    dodgeDuration: 180,
    dodgeCooldown: 900
};

// ==========================================
// GAME SETUP
// ==========================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};
const mouse = { x: 450, y: 275 };

let player;
let boss;
let arrows;
let bullets;
let particles;
let gameState;
let phase;
let phaseStart;
let victoryTime = 0;
let fireballs;
let meteors;
let lavaPools;
let shakeUntil;
let lastShot;
let lastAttack;
let lastFrame = performance.now();

function resetGame() {

    player = {
        x: 150,
        y: 275,
        radius: 19,
        health: settings.playerHealth,
        invincibleUntil: 0,
        dodgeUntil: 0,
        lastDodge: -1000,
        dodgeX: 0,
        dodgeY: 0
    };

    boss = {
        x: 730,
        y: 275,
        radius: 45,
        health: settings.bossHealth,
        flashUntil: 0
    };

    arrows = [];
    bullets = [];
    particles = [];

    gameState = "playing";
phase = 1;
phaseStart = 0;
fireballs = [];
meteors = [];
lavaPools = [];
shakeUntil = 0;
    lastShot = -1000;
    lastAttack = performance.now();
}

// ==========================================
// CONTROLS
// ==========================================

window.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    keys[key] = true;

    if ([" ", "arrowup", "arrowdown",
         "arrowleft", "arrowright"].includes(key)) {
        event.preventDefault();
    }
});

window.addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

function updateMouse(event) {

    const rect = canvas.getBoundingClientRect();

    mouse.x = (event.clientX - rect.left)
        * canvas.width / rect.width;

    mouse.y = (event.clientY - rect.top)
        * canvas.height / rect.height;
}

canvas.addEventListener("mousemove", updateMouse);

canvas.addEventListener("mousedown", event => {

    updateMouse(event);

    if (gameState !== "playing") return;

    const now = performance.now();

    if (now - lastShot < 250) return;

    lastShot = now;

    const angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );

    arrows.push({
        x: player.x + Math.cos(angle) * 25,
        y: player.y + Math.sin(angle) * 25,
        vx: Math.cos(angle) * settings.arrowSpeed,
        vy: Math.sin(angle) * settings.arrowSpeed,
        angle: angle
    });
});

// ==========================================
// PARTICLE EFFECTS
// ==========================================

function burst(x, y, color, amount) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1
        });
    }
}

// ==========================================
// UPDATE PLAYER
// ==========================================

function updatePlayer(now, dt) {

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) dy--;
    if (keys["s"] || keys["arrowdown"]) dy++;
    if (keys["a"] || keys["arrowleft"]) dx--;
    if (keys["d"] || keys["arrowright"]) dx++;

    const length = Math.hypot(dx, dy);

    if (length > 0) {
        dx /= length;
        dy /= length;
    }

    // Dodge ability

    if (
        keys[" "] &&
        length > 0 &&
        now - player.lastDodge > settings.dodgeCooldown
    ) {
        player.lastDodge = now;
        player.dodgeUntil = now + settings.dodgeDuration;
        player.invincibleUntil = player.dodgeUntil;
        player.dodgeX = dx;
        player.dodgeY = dy;
    }

    if (now < player.dodgeUntil) {

        player.x += player.dodgeX * settings.dodgeSpeed * dt;
        player.y += player.dodgeY * settings.dodgeSpeed * dt;

        burst(player.x, player.y, "#00ffff", 1);

    } else {

        player.x += dx * settings.playerSpeed * dt;
        player.y += dy * settings.playerSpeed * dt;
    }

    // Arena walls

    player.x = Math.max(
        40, Math.min(canvas.width - 40, player.x)
    );

    player.y = Math.max(
        85, Math.min(canvas.height - 40, player.y)
    );
}

// ==========================================
// DAMAGE PLAYER
// ==========================================

function hurtPlayer(now) {

    if (now < player.invincibleUntil) return;

    player.health--;

    player.invincibleUntil = now + 1000;

    burst(player.x, player.y, "#ff3333", 20);

    if (player.health <= 0) {
        gameState = "defeat";
    }
}

// ==========================================
// BORP BOSS AI
// ==========================================

function updateBoss(now, dt) {
if (phase === 2) {

    if (now - phaseStart < 2000) return;

    const angle = Math.atan2(
        player.y - boss.y,
        player.x - boss.x
    );

    boss.x += Math.cos(angle) *
        settings.phaseTwoSpeed * dt;

    boss.y += Math.sin(angle) *
        settings.phaseTwoSpeed * dt;

    if (now - lastAttack >= settings.fireballDelay) {

        lastAttack = now;

        fireballs.push({
            x: boss.x,
            y: boss.y,
            vx: Math.cos(angle) * settings.fireballSpeed,
            vy: Math.sin(angle) * settings.fireballSpeed
        });

        burst(boss.x, boss.y, "#ff5500", 25);
    }

    if (Math.hypot(
        player.x - boss.x,
        player.y - boss.y
    ) < boss.radius + player.radius) {
        hurtPlayer(now);
    }

    return;
}
    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const distance = Math.hypot(dx, dy);

    const angry = boss.health <= settings.bossHealth / 2;

    const speed = angry
        ? settings.bossSpeed * 1.8
        : settings.bossSpeed;

    // Chase Forest Blob

    if (distance > 0) {

        boss.x += dx / distance * speed * dt;
        boss.y += dy / distance * speed * dt;
    }

    // Contact damage

    if (distance < boss.radius + player.radius) {

        hurtPlayer(now);

        if (distance > 0) {
            player.x += dx / distance * 30;
            player.y += dy / distance * 30;
        }
    }

    // Boss attacks

    const delay = angry
        ? settings.bossAttackDelay * 0.55
        : settings.bossAttackDelay;

    if (now - lastAttack > delay) {

        lastAttack = now;

        const angle = Math.atan2(dy, dx);

        const amount = angry ? 5 : 3;

        for (let i = 0; i < amount; i++) {

            const spread = (i - (amount - 1) / 2) * 0.25;
            const direction = angle + spread;

            bullets.push({
                x: boss.x,
                y: boss.y,
                vx: Math.cos(direction) *
                    settings.enemyBulletSpeed,
                vy: Math.sin(direction) *
                    settings.enemyBulletSpeed
            });
        }

        burst(boss.x, boss.y, "#ff8800", 10);
    }
}

// ==========================================
// UPDATE PROJECTILES
// ==========================================

function outsideArena(object) {

    return object.x < -50 ||
           object.x > canvas.width + 50 ||
           object.y < -50 ||
           object.y > canvas.height + 50;
}

function updateProjectiles(now, dt) {

    // Player arrows

    for (let i = arrows.length - 1; i >= 0; i--) {

        const arrow = arrows[i];

        arrow.x += arrow.vx * dt;
        arrow.y += arrow.vy * dt;

        const distance = Math.hypot(
            arrow.x - boss.x,
            arrow.y - boss.y
        );

        if (distance < boss.radius) {

            boss.health -= settings.arrowDamage;
            boss.flashUntil = now + 150;

            burst(arrow.x, arrow.y, "#ffff55", 15);

            arrows.splice(i, 1);

            if (boss.health <= 0) {

    if (phase === 1) {

        phase = 2;
        phaseStart = now;

        boss.health = settings.phaseTwoHealth;

        bullets = [];
        arrows = [];

        lastAttack = now + 2000;

        shakeUntil = now + 700;

        burst(boss.x, boss.y, "#a020ff", 100);

    } else {

        boss.health = 0;

        burst(boss.x, boss.y, "#a020ff", 100);
victoryTime = now;
        gameState = "victory";
    }

    return;
}

        } else if (outsideArena(arrow)) {

            arrows.splice(i, 1);
        }
    }

    // Boss energy balls

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        const distance = Math.hypot(
            bullet.x - player.x,
            bullet.y - player.y
        );

        if (distance < player.radius + 7) {

            hurtPlayer(now);
            bullets.splice(i, 1);

        } else if (outsideArena(bullet)) {

            bullets.splice(i, 1);
        }
    }
}

// ==========================================
// DRAW ARENA
// ==========================================
// ==========================================
// PHASE TWO HAZARDS
// ==========================================

function updateHazards(now, dt) {

    // Giant fireballs

    for (let i = fireballs.length - 1; i >= 0; i--) {

        const f = fireballs[i];

        f.x += f.vx * dt;
        f.y += f.vy * dt;

        burst(f.x, f.y, "#ff5500", 2);

        if (Math.hypot(
            f.x - player.x,
            f.y - player.y
        ) < settings.fireballSize + player.radius) {

            hurtPlayer(now);
            shakeUntil = now + settings.screenShakeDuration;
        }

        // Fireball hits a wall

        if (
            f.x < 20 ||
            f.x > canvas.width - 20 ||
            f.y < 65 ||
            f.y > canvas.height - 20
        ) {

            shakeUntil = now + settings.screenShakeDuration;

            burst(f.x, f.y, "#ff6600", 80);

            fireballs.splice(i, 1);

            // Summon meteors

            for (let m = 0; m < settings.meteorAmount; m++) {

                meteors.push({
                    x: 70 + Math.random() * 760,
                    y: 110 + Math.random() * 380,
                    start: now + m * 120
                });
            }
        }
    }

    // Falling meteors

    for (let i = meteors.length - 1; i >= 0; i--) {

        const m = meteors[i];

        if (
            now >= m.start +
            settings.meteorWarningTime
        ) {

            burst(m.x, m.y, "#ff8800", 30);

            shakeUntil = now + 150;

            lavaPools.push({
                x: m.x,
                y: m.y,
                expires: now + settings.lavaDuration
            });

            meteors.splice(i, 1);
        }
    }

    // Lava damage

    for (let i = lavaPools.length - 1; i >= 0; i--) {

        const lava = lavaPools[i];

        if (now >= lava.expires) {

            lavaPools.splice(i, 1);
            continue;
        }

        if (Math.hypot(
            player.x - lava.x,
            player.y - lava.y
        ) < settings.lavaSize + player.radius) {

            hurtPlayer(now);
        }
    }
}

function drawHazards(now) {

    // Lava pools

    for (const lava of lavaPools) {

        ctx.save();

        ctx.shadowColor = "orange";
        ctx.shadowBlur = 20;

        ctx.fillStyle = "#ff4400";

        ctx.beginPath();
        ctx.arc(
            lava.x, lava.y,
            settings.lavaSize,
            0, Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ffaa00";

        ctx.beginPath();
        ctx.arc(
            lava.x, lava.y,
            settings.lavaSize * 0.6,
            0, Math.PI * 2
        );
        ctx.fill();

        ctx.restore();
    }

    // Meteor warning circles and falling rocks

    for (const m of meteors) {

        if (now < m.start) continue;

        const progress = Math.min(
            (now - m.start) /
            settings.meteorWarningTime,
            1
        );

        ctx.save();

        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(
            m.x, m.y,
            settings.lavaSize,
            0, Math.PI * 2
        );
        ctx.stroke();

        // Meteor falling toward the warning circle

        const meteorY = m.y - 350 * (1 - progress);

        ctx.shadowColor = "orange";
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#ff6600";

        ctx.beginPath();
        ctx.arc(
            m.x, meteorY,
            12, 0, Math.PI * 2
        );
        ctx.fill();

        ctx.restore();
    }

    // Giant fireballs

    for (const f of fireballs) {

        ctx.save();

        ctx.shadowColor = "red";
        ctx.shadowBlur = 35;
        ctx.fillStyle = "#ff4400";

        ctx.beginPath();
        ctx.arc(
            f.x, f.y,
            settings.fireballSize,
            0, Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ffff55";

        ctx.beginPath();
        ctx.arc(
            f.x, f.y,
            settings.fireballSize * 0.5,
            0, Math.PI * 2
        );
        ctx.fill();

        ctx.restore();
    }
}
function drawArena() {

    const gradient = ctx.createRadialGradient(
        450, 275, 30,
        450, 275, 500
    );

    gradient.addColorStop(0, "#30151d");
    gradient.addColorStop(1, "#090508");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 900, 550);

    // Floor tiles

    ctx.strokeStyle = "#ffffff09";

    for (let x = 0; x < 900; x += 50) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 550);
        ctx.stroke();
    }

    for (let y = 0; y < 550; y += 50) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(900, y);
        ctx.stroke();
    }

    // Glowing arena border

    ctx.save();

    ctx.strokeStyle = "#ff3333";
    ctx.shadowColor = "red";
    ctx.shadowBlur = 15;
    ctx.lineWidth = 3;

    ctx.strokeRect(20, 65, 860, 465);

    ctx.restore();
}

// ==========================================
// DRAW FOREST BLOB
// ==========================================

function drawPlayer(now) {

    ctx.save();

    ctx.translate(player.x, player.y);
// Walking animation
const moving =
    keys["w"] || keys["a"] ||
    keys["s"] || keys["d"] ||
    keys["arrowup"] || keys["arrowdown"] ||
    keys["arrowleft"] || keys["arrowright"];

const walk = moving ? Math.sin(now / 80) * 7 : 0;
const bob = moving ? Math.abs(Math.sin(now / 80)) * 3 : 0;

// Animated legs
ctx.fillStyle = "#008f5d";
ctx.beginPath();
ctx.ellipse(-9 + walk, 19, 6, 9, 0, 0, Math.PI * 2);
ctx.fill();

ctx.beginPath();
ctx.ellipse(9 - walk, 19, 6, 9, 0, 0, Math.PI * 2);
ctx.fill();

// Make the body bounce
ctx.translate(0, -bob);
    if (now < player.invincibleUntil) {

        ctx.globalAlpha =
            Math.sin(now / 50) > 0 ? 0.4 : 1;
    }

    // Body

    ctx.fillStyle = settings.playerColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 21, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-6, -5, 5, 0, Math.PI * 2);
    ctx.arc(7, -5, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-5, -5, 2.5, 0, Math.PI * 2);
    ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Aim bow toward mouse

    const angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );

    ctx.rotate(angle);
    ctx.translate(24, 0);

    ctx.strokeStyle = "#c18b45";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.arc(0, 0, 17, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    // Bow string

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, -17);
    ctx.lineTo(0, 17);
    ctx.stroke();

    ctx.restore();
}

// ==========================================
// DRAW BORP
// ==========================================

function drawBoss(now) {

    if (boss.health <= 0) {
    const progress = Math.min(
        (now - victoryTime) / 2000, 1
    );

    if (progress >= 1) return;

    ctx.save();
    ctx.translate(boss.x, boss.y);
    ctx.rotate(progress * Math.PI * 6);
    ctx.scale(1 - progress, 1 - progress);

    ctx.fillStyle = "#a020ff";
    ctx.shadowColor = "#bd55ff";
    ctx.shadowBlur = 50;

    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return;
}

    ctx.save();

    ctx.translate(boss.x, boss.y);

   const angry = phase === 2;

    const wobble = Math.sin(now / 150) * 3;

    // Boss glow

    ctx.shadowColor = angry ? "red" : "#55ff33";
    ctx.shadowBlur = angry ? 30 : 12;

    // Legs

    ctx.strokeStyle = "#315d22";
    ctx.lineWidth = 9;

    ctx.beginPath();
    ctx.moveTo(-20, 25);
    ctx.lineTo(-25 + wobble, 48);
    ctx.moveTo(20, 25);
    ctx.lineTo(25 - wobble, 48);
    ctx.stroke();

    // Antennae

    ctx.beginPath();
    ctx.moveTo(-20, -30);
    ctx.lineTo(-30, -57);
    ctx.moveTo(20, -30);
    ctx.lineTo(30, -57);
    ctx.stroke();

    // Body

    ctx.fillStyle = now < boss.flashUntil
        ? "#ff2222"
        : (phase === 2
    ? settings.phaseTwoColor
    : settings.bossColor);

    ctx.beginPath();
    ctx.ellipse(
        0, 0,
        40 + wobble,
        45 - wobble,
        0, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    // Eyes

    ctx.fillStyle = phase === 2 ? "#ff2222" : "white";

    ctx.beginPath();
    ctx.arc(-15, -10, 12, 0, Math.PI * 2);
    ctx.arc(15, -10, 12, 0, Math.PI * 2);
    ctx.fill();

    const angle = Math.atan2(
        player.y - boss.y,
        player.x - boss.x
    );

    ctx.fillStyle = phase === 2 ? "#780000" : "black";

    ctx.beginPath();

    ctx.arc(
        -15 + Math.cos(angle) * 4,
        -10 + Math.sin(angle) * 4,
        5, 0, Math.PI * 2
    );

    ctx.arc(
        15 + Math.cos(angle) * 4,
        -10 + Math.sin(angle) * 4,
        5, 0, Math.PI * 2
    );

    ctx.fill();

    // Angry eyebrows

    ctx.strokeStyle = "#203b13";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(-27, -26);
    ctx.lineTo(-5, -17);
    ctx.moveTo(27, -26);
    ctx.lineTo(5, -17);
    ctx.stroke();

    // Mouth

    ctx.fillStyle = "#203b13";
    ctx.fillRect(-12, 15, 24, 7);

    ctx.restore();
}

// ==========================================
// DRAW PROJECTILES
// ==========================================

function drawProjectiles() {

    for (const arrow of arrows) {

        ctx.save();

        ctx.translate(arrow.x, arrow.y);
        ctx.rotate(arrow.angle);

        ctx.strokeStyle = "#c69b61";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.lineTo(0, 0);
        ctx.stroke();

        ctx.fillStyle = "#dddddd";

        ctx.beginPath();
        ctx.moveTo(5, 0);
        ctx.lineTo(-4, -5);
        ctx.lineTo(-4, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    for (const bullet of bullets) {

        ctx.save();

        ctx.shadowColor = "#ff3300";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#ff6633";

        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// ==========================================
// DRAW PARTICLES
// ==========================================

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= 0.025 * dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.save();

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        ctx.fillRect(p.x, p.y, 4, 4);

        ctx.restore();
    }
}

// ==========================================
// HEALTH BARS
// ==========================================

function drawHUD(now) {

    ctx.textAlign = "left";
    ctx.font = "25px Arial";

    for (let i = 0; i < settings.playerHealth; i++) {

        ctx.fillStyle = i < player.health
            ? "#ff4444"
            : "#444444";

        ctx.fillText("♥", 25 + i * 30, 40);
    }

    // Boss health
// Boss health bar

const maxHealth = phase === 1
    ? settings.bossHealth
    : settings.phaseTwoHealth;

const transition = now - phaseStart;

ctx.textAlign = "center";

if (phase === 2 && transition < 2000) {

    // Broken left half

    ctx.save();

    ctx.translate(350, 35);
    ctx.rotate(-0.08);

    ctx.fillStyle = "#555555";
    ctx.fillRect(-100, -10, 195, 20);

    ctx.restore();

    // Falling right half

    ctx.save();

    ctx.translate(
        550,
        35 + Math.pow(transition / 100, 2)
    );

    ctx.rotate(transition / 500);

    ctx.fillStyle = "#555555";
    ctx.fillRect(-95, -10, 195, 20);

    ctx.restore();

    ctx.fillStyle = "#bd55ff";
    ctx.font = "bold 24px Arial";

    ctx.fillText("BORP IS NOT FINISHED!", 450, 75);

} else {

    ctx.fillStyle = "#444444";
    ctx.fillRect(250, 25, 400, 20);

    ctx.fillStyle = phase === 2
        ? "#a020ff"
        : "#55cc33";

    ctx.fillRect(
        250, 25,
        400 * boss.health / maxHealth,
        20
    );

    ctx.fillStyle = "white";
    ctx.font = "bold 16px Arial";

    ctx.fillText(
        (phase === 2 ? "CORRUPTED BORP" : "BORP")
        + " — " + boss.health + "/" + maxHealth,
        450, 19
    );
}
    // Dodge cooldown

    const ready =
        now - player.lastDodge > settings.dodgeCooldown;

    ctx.fillStyle = ready ? "cyan" : "#777777";
    ctx.font = "15px Arial";

    ctx.fillText(
        ready ? "DODGE READY" : "RECHARGING",
        780, 40
    );
}

// ==========================================
// VICTORY AND DEFEAT
// ==========================================

function drawEnding() {

    if (gameState === "playing") return;
if (
    gameState === "victory" &&
    performance.now() - victoryTime < 2000
) return;
    ctx.fillStyle = "#000000bb";
    ctx.fillRect(0, 0, 900, 550);

    ctx.save();

    ctx.textAlign = "center";
    ctx.font = "bold 55px Arial";

    const won = gameState === "victory";

    ctx.fillStyle = won ? "#55ff66" : "#ff3333";
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 25;

    ctx.fillText(
        won ? "VICTORY!" : "DEFEATED",
        450, 240
    );

    ctx.shadowBlur = 0;
    ctx.fillStyle = "white";
    ctx.font = "22px Arial";

    ctx.fillText(
        won
            ? "Forest Blob defeated Borp!"
            : "Borp has conquered the dimension!",
        450, 290
    );

    ctx.font = "17px Arial";

    ctx.fillStyle = won ? "#ffdd00" : "white";

ctx.fillText(
    won
        ? "SECRET ACCESS CODE: YIPPEE"
        : "Click RESTART to try again.",
    450, 335
);

    ctx.restore();
}

// ==========================================
// MAIN GAME LOOP
// ==========================================

function gameLoop(now) {

    const dt = Math.min((now - lastFrame) / 16.67, 2);

    lastFrame = now;

    if (gameState === "playing") {

        updatePlayer(now, dt);
        updateBoss(now, dt);
if (gameState === "playing") {
    updateHazards(now, dt);
}
        if (gameState === "playing") {
            updateProjectiles(now, dt);
        }
    }

    updateParticles(dt);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

ctx.save();

// Screen shake

if (now < shakeUntil) {

    ctx.translate(
        (Math.random() - 0.5) *
            settings.screenShakeStrength * 2,

        (Math.random() - 0.5) *
            settings.screenShakeStrength * 2
    );
}

drawArena();
drawHazards(now);
    drawPlayer(now);
    drawBoss(now);
    drawProjectiles();
    drawParticles();
    drawHUD(now);
    drawEnding();
ctx.restore();
    requestAnimationFrame(gameLoop);
}

resetGame();
requestAnimationFrame(gameLoop);

</script>
